# Increase daemon memory allocation
org.gradle.jvmargs=-Xmx2g "-XX:MaxMetaspaceSize=512m"

# Enable parallel build by default for faster builds
org.gradle.parallel=true

# Enable build cache for faster incremental builds
org.gradle.caching=true

# MySQL server version for every Testcontainers-backed test. Production runs the 8.0 line.
mysqlTestVersion=8.0.46
