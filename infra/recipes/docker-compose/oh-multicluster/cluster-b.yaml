cluster:
  name: "LocalHadoopClusterB"
  replication:
    peers:
      LocalHadoopClusterA:
        tables-api-base-uri: "http://tables-a:8080"
        cascade-signing-key: "${OPENHOUSE_REPLICATION_CASCADE_KEY}"
  storage:
    type: "hadoop"
    uri: "hdfs://namenode-b:9000/"
    root-path: "/data/openhouse"
  storages:
    default-type: "hdfs"
    types:
      hdfs:
        rootpath: "/data/openhouse"
        endpoint: "hdfs://namenode-b:9000/"
  iceberg:
    write:
      format:
        default: "orc"
      metadata:
        previous-versions-max: 28
        delete-after-commit:
          enabled: true
  housetables:
    base-uri: "http://housetables-b:8080"
    database:
      type: "MYSQL"
      url: "jdbc:mysql://mysql-b:3306/oh_db?allowPublicKeyRetrieval=true&useSSL=false"
  security:
    token:
      interceptor:
        classname: "com.linkedin.openhouse.common.security.DummyTokenInterceptor"
    tables:
      authorization:
        enabled: true
        opa:
          base-uri: "http://opa:8181"
