x-openhouse-tables: &openhouse-tables
  build:
    context: ../../../..
    dockerfile: tables-service.Dockerfile
  volumes:
    - ./:/var/config/:ro
  environment: &openhouse-otel
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_TRACES_EXPORTER: otlp
    OTEL_METRICS_EXPORTER: none
    OTEL_LOGS_EXPORTER: none
    OTEL_TRACES_SAMPLER: always_on

x-openhouse-housetables: &openhouse-housetables
  build:
    context: ../../../..
    dockerfile: housetables-service.Dockerfile
  volumes:
    - ./:/var/config/:ro
  environment: *openhouse-otel

x-hadoop-namenode: &hadoop-namenode
  image: bde2020/hadoop-namenode:1.2.0-hadoop2.8-java8
  restart: always

x-hadoop-datanode: &hadoop-datanode
  image: bde2020/hadoop-datanode:1.2.0-hadoop2.8-java8
  restart: always

services:
  tables-a:
    <<: *openhouse-tables
    ports:
      - target: 8080
    environment:
      <<: *openhouse-otel
      OTEL_SERVICE_NAME: openhouse-tables-a
      OPENHOUSE_CLUSTER_CONFIG_PATH: /var/config/cluster-a.yaml
      OPENHOUSE_REPLICATION_CASCADE_KEY: "${OPENHOUSE_REPLICATION_CASCADE_KEY:-local-only-multicluster-replication-signing-key}"
      CLUSTER_REPLICATION_CASCADE_MODE: "${OH_MULTICLUSTER_CASCADE_MODE:-service}"
    depends_on:
      - housetables-a
      - namenode-a
      - datanode-a
      - prometheus
      - opa
      - jaeger

  housetables-a:
    <<: *openhouse-housetables
    ports:
      - target: 8080
    environment:
      <<: *openhouse-otel
      HTS_DB_USER: oh_user
      HTS_DB_PASSWORD: oh_password
      OTEL_SERVICE_NAME: openhouse-housetables-a
      OPENHOUSE_CLUSTER_CONFIG_PATH: /var/config/cluster-a.yaml
    depends_on:
      mysql-a:
        condition: service_healthy
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started

  tables-b:
    <<: *openhouse-tables
    ports:
      - target: 8080
    environment:
      <<: *openhouse-otel
      OTEL_SERVICE_NAME: openhouse-tables-b
      OPENHOUSE_CLUSTER_CONFIG_PATH: /var/config/cluster-b.yaml
      OPENHOUSE_REPLICATION_CASCADE_KEY: "${OPENHOUSE_REPLICATION_CASCADE_KEY:-local-only-multicluster-replication-signing-key}"
      CLUSTER_REPLICATION_CASCADE_MODE: "${OH_MULTICLUSTER_CASCADE_MODE:-service}"
    depends_on:
      - housetables-b
      - namenode-b
      - datanode-b
      - prometheus
      - opa
      - jaeger

  housetables-b:
    <<: *openhouse-housetables
    ports:
      - target: 8080
    environment:
      <<: *openhouse-otel
      HTS_DB_USER: oh_user
      HTS_DB_PASSWORD: oh_password
      OTEL_SERVICE_NAME: openhouse-housetables-b
      OPENHOUSE_CLUSTER_CONFIG_PATH: /var/config/cluster-b.yaml
    depends_on:
      mysql-b:
        condition: service_healthy
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started

  namenode-a:
    <<: *hadoop-namenode
    ports:
      - target: 9870
      - target: 9000
    environment:
      CLUSTER_NAME: openhouse-a
      CORE_CONF_fs_defaultFS: hdfs://namenode-a:9000
    volumes:
      - hdfs_namenode_a:/hadoop/dfs/name

  datanode-a:
    <<: *hadoop-datanode
    ports:
      - target: 9864
      - target: 9866
    environment:
      SERVICE_PRECONDITION: namenode-a:9870
      CORE_CONF_fs_defaultFS: hdfs://namenode-a:9000
    volumes:
      - hdfs_datanode_a:/hadoop/dfs/data

  namenode-b:
    <<: *hadoop-namenode
    ports:
      - target: 9870
      - target: 9000
    environment:
      CLUSTER_NAME: openhouse-b
      CORE_CONF_fs_defaultFS: hdfs://namenode-b:9000
    volumes:
      - hdfs_namenode_b:/hadoop/dfs/name

  datanode-b:
    <<: *hadoop-datanode
    ports:
      - target: 9864
      - target: 9866
    environment:
      SERVICE_PRECONDITION: namenode-b:9870
      CORE_CONF_fs_defaultFS: hdfs://namenode-b:9000
    volumes:
      - hdfs_datanode_b:/hadoop/dfs/data

  mysql-a:
    image: mysql:8
    ports:
      - target: 3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: oh_root_password
      MYSQL_PASSWORD: oh_password
      MYSQL_USER: oh_user
      MYSQL_DATABASE: oh_db
    volumes:
      - mysql_a_data:/var/lib/mysql

  mysql-b:
    image: mysql:8
    ports:
      - target: 3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: oh_root_password
      MYSQL_PASSWORD: oh_password
      MYSQL_USER: oh_user
      MYSQL_DATABASE: oh_db
    volumes:
      - mysql_b_data:/var/lib/mysql

  prometheus:
    image: prom/prometheus:v2.21.0
    ports:
      - target: 9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command: --web.enable-lifecycle --config.file=/etc/prometheus/prometheus.yml

  jaeger:
    image: jaegertracing/all-in-one:1.54
    ports:
      - target: 16686
      - target: 4317
      - target: 4318
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  opa:
    extends:
      file: ../common/opa-services.yml
      service: opa
    ports: !override
      - target: 8181

volumes:
  hdfs_namenode_a:
  hdfs_datanode_a:
  hdfs_namenode_b:
  hdfs_datanode_b:
  mysql_a_data:
  mysql_b_data:
