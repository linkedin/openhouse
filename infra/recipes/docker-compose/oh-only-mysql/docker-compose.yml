# MySQL reconstructs the recorded DDL in filename order on a fresh data volume.
# HTS waits for the final TCP server, not the socket-only initialization server,
# so its CREATE TABLE IF NOT EXISTS bootstrap cannot race the recorded schema.
version: "3.3"
services:
  openhouse-tables:
    extends:
      file: ../common/oh-services.yml
      service: openhouse-tables
    volumes:
      - ./:/var/config/
    depends_on:
      - openhouse-housetables
      - prometheus
      - opa

  openhouse-housetables:
    extends:
      file: ../common/oh-services.yml
      service: openhouse-housetables
    volumes:
      - ./:/var/config/
    depends_on:
      prometheus:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      - HTS_DB_USER=oh_user
      - HTS_DB_PASSWORD=oh_password

  mysql:
    extends:
      file: ../common/mysql-services.yml
      service: mysql
    volumes:
      - ../../../../services/housetables/ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1
          -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}"
          -e 'SELECT entity_type FROM user_table_row LIMIT 0'
      interval: 5s
      timeout: 5s
      retries: 60

  prometheus:
    extends:
      file: ../common/oh-services.yml
      service: prometheus

  opa:
    container_name: local.opa
    extends:
      file: ../common/opa-services.yml
      service: opa

  oauth:
    container_name: local.oauth
    extends:
      file: ../common/oauth-services.yml
      service: oauth
