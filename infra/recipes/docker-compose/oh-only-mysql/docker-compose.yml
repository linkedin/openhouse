# The oh-only recipe with a real MySQL backing store in place of the in-memory H2.
#
# oh-only stays as it is: it is the documented least-resource quickstart, and keeping it
# unchanged preserves coverage of the IN_MEMORY code path. This recipe exists so that CI,
# and anyone debugging House Tables persistence, runs against the database the service
# actually uses in production rather than H2's MySQL compatibility mode.
#
# services/housetables/ddl/*.sql is mounted into the MySQL image's initialisation
# directory, which applies it in filename order when initializing an empty data directory,
# before MySQL accepts normal TCP connections. depends_on orders container startup but does
# not wait for database readiness; CI polls the HTS endpoint before running tests.
# The service's CREATE TABLE IF NOT EXISTS schema.sql leaves these DDL-created tables intact.
# The separate mysqlIndexTest suite also validates a pinned copy of the DDL in Testcontainers.
version: "3.3"
services:
  openhouse-tables:
    extends:
      file: ../common/oh-services.yml
      service: openhouse-tables
    volumes:
      - ./:/var/config/
    depends_on:
      - openhouse-housetables
      - prometheus
      - opa

  openhouse-housetables:
    extends:
      file: ../common/oh-services.yml
      service: openhouse-housetables
    volumes:
      - ./:/var/config/
    depends_on:
      - prometheus
      - mysql
    environment:
      - HTS_DB_USER=oh_user
      - HTS_DB_PASSWORD=oh_password

  mysql:
    extends:
      file: ../common/mysql-services.yml
      service: mysql
    volumes:
      - ../../../../services/housetables/ddl:/docker-entrypoint-initdb.d:ro

  prometheus:
    extends:
      file: ../common/oh-services.yml
      service: prometheus

  opa:
    container_name: local.opa
    extends:
      file: ../common/opa-services.yml
      service: opa

  oauth:
    container_name: local.oauth
    extends:
      file: ../common/oauth-services.yml
      service: oauth
