cluster:
  name: "AKSCluster"
  storage:
    type: "hadoop"
    uri: "hdfs://namenode:9000/"
    root-path: "/data/openhouse"
  storages:
    default-type: "adls"
    types:
      adls:
        rootpath: <container-name>@<storage-account-name>.dfs.core.windows.net 
        endpoint: "abfs://"
        parameters:
          adls.auth.shared-key.account.name: <storage-account-name>
          adls.auth.shared-key.account.key: <storage-account-key>
  iceberg:
    write:
      format:
        default: "orc"
      metadata:
        previous-versions-max: 78
        delete-after-commit:
          enabled: true
  metadata:
    database:
      url: <database-url>
  housetables:
    base-uri: "http://openhouse-housetables-service:8080"
    database:
      type: "MYSQL"
  security:
    token:
      interceptor:
        classname: null
    tables:
      authorization:
        enabled: false