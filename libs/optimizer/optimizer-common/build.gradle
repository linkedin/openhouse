plugins {
  id 'openhouse.springboot-ext-conventions'
  id 'openhouse.maven-publish'
  id 'org.springframework.boot' version '2.7.8'
  // Test fixtures: MySqlContainerInitializer, which runs a Spring test on MySQL in Docker, shared
  // with :services:optimizer's tests.
  id 'java-test-fixtures'
}

// Shared optimizer core: db entities and the Flyway migrations that create their tables, model
// DTOs, repositories, and the analyzer SPI. Depended on by the Optimizer Service
// (:services:optimizer) and by the analyzer/scheduler/binpack libraries, so those libraries no
// longer need to depend on the service module (breaks the dependency cycle that blocked hosting the
// analyzer in the service process). Library jar only — no entry point.
bootJar {
  enabled = false
}

jar {
  enabled = true
  archiveClassifier = ''
}

dependencies {
  implementation project(':cluster:configs')
  api 'org.springframework.boot:spring-boot-starter-data-jpa:2.7.8'
  api 'com.vladmihalcea:hibernate-types-55:2.21.1'
  testImplementation 'org.springframework.boot:spring-boot-starter-test:2.7.8'
  testRuntimeOnly 'com.h2database:h2:2.1.210'
  testRuntimeOnly 'mysql:mysql-connector-java:8.0.33'
  // Flyway creates the repository tests' tables from the migrations, as it does for the service.
  testRuntimeOnly 'org.flywaydb:flyway-core:8.5.13'
  testRuntimeOnly 'org.flywaydb:flyway-mysql:8.5.13'
  // MySqlContainerInitializer: a MySQL container for each Spring test context.
  testFixturesApi 'org.testcontainers:mysql:1.21.4'
  testFixturesImplementation 'org.springframework.boot:spring-boot-test:2.7.8'
  // Testcontainers connects over JDBC to tell when the server is ready.
  testFixturesRuntimeOnly 'mysql:mysql-connector-java:8.0.33'
}

// The test fixtures serve this repository's tests only; publish the library without them.
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }

test {
  useJUnitPlatform()
}
