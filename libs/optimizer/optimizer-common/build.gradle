plugins {
  id 'openhouse.springboot4-conventions'
  id 'openhouse.maven-publish'
}

// Shared optimizer core: db entities, repositories, and the analyzer SPI, over the model DTOs in
// :libs:optimizer:optimizer-model. Depended on by the Optimizer Service (:services:optimizer) and by
// the analyzer/scheduler libraries, so those libraries no longer need to depend on the service module
// (breaks the dependency cycle that blocked hosting the analyzer in the service process). Library jar
// only — no entry point.
dependencies {
  api project(':libs:optimizer:optimizer-model')
  api 'org.springframework.boot:spring-boot-starter-data-jpa'
  // Serializes the JSON columns.
  implementation 'tools.jackson.core:jackson-databind'
  testRuntimeOnly 'com.h2database:h2'
}
