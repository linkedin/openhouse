plugins {
  id 'openhouse.springboot-ext-conventions'
  id 'openhouse.maven-publish'
  id 'org.springframework.boot' version '2.7.8'
}

// Shared optimizer core: db entities, model DTOs, repositories, and the analyzer SPI. Depended on
// by the Optimizer Service (:services:optimizer) and by the analyzer/scheduler/binpack libraries,
// so those libraries no longer need to depend on the service module (breaks the dependency cycle
// that blocked hosting the analyzer in the service process). Library jar only — no entry point.
bootJar {
  enabled = false
}

jar {
  enabled = true
  archiveClassifier = ''
}

dependencies {
  api 'org.springframework.boot:spring-boot-starter-data-jpa:2.7.8'
  api 'com.vladmihalcea:hibernate-types-55:2.21.1'
  testImplementation 'org.springframework.boot:spring-boot-starter-test:2.7.8'
  testRuntimeOnly 'com.h2database:h2:2.1.210'
}

test {
  useJUnitPlatform()
}
