# Runs a Spring test on a MySQL 8.0 container that Testcontainers starts at the first connection
# and stops when the context closes its datasource. Add to a test with
# @TestPropertySource(locations = "classpath:optimizer-mysql-testcontainers.properties").
#
# connectionAttributes carries a UUID that Spring resolves once, when it binds
# spring.datasource.url into DataSourceProperties, and Testcontainers shares one container per
# distinct URL. Each cached Spring test context therefore gets a container, and a database, of its
# own.
# socketTimeout bounds how long the application's JDBC connections (the pool, Flyway, Hibernate)
# wait for MySQL, since Connector/J has no read timeout by default. It does not bound
# Testcontainers' own readiness check, which uses its defaults.
spring.datasource.url=jdbc:tc:mysql:8.0.46:///optimizer?socketTimeout=60000&connectionAttributes=context:${random.uuid}
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
