plugins {
  id 'openhouse.springboot4-conventions'
  id 'openhouse.maven-publish'
}

// Library jar — the @SpringBootApplication entry point lives in :apps:optimizer:analyzerapp.
dependencies {
  // api: the analyzer's public types (e.g. OperationAnalyzer's signature, OperationTypeDto) come
  // from :libs:optimizer:optimizer-common, so consumers of this library see them on their compile
  // classpath.
  api project(':libs:optimizer:optimizer-common')
  implementation 'org.springframework.boot:spring-boot-starter'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  runtimeOnly 'com.mysql:mysql-connector-j'
}
