plugins {
  id 'openhouse.springboot4-conventions'
  id 'openhouse.maven-publish'
}

// Library jar — the @SpringBootApplication entry point lives in :apps:optimizer:schedulerapp.
dependencies {
  // api: the scheduler's public types (e.g. Bin, BinPacker, OperationTypeDto) come from
  // :libs:optimizer:optimizer-common and :libs:optimizer:binpack, so consumers of this library see
  // them on their compile classpath.
  api project(':libs:optimizer:optimizer-common')
  api project(':libs:optimizer:binpack')
  implementation 'org.springframework.boot:spring-boot-starter'
  // WebClient for the Jobs Service.
  implementation 'org.springframework.boot:spring-boot-starter-webclient'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  runtimeOnly 'com.mysql:mysql-connector-j'
}
