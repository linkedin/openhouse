plugins {
    // dependency in apps-spark-conventions
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'openhouse.apps-spark-common'
    id 'openhouse.iceberg-conventions-1.5.2'
}

ext {
    log4jVersion = "2.20.0"

    sparkVersion = '3.5.2'
    icebergVersion = rootProject.ext.iceberg_1_5_version
    sparkVersionSuffix = "3.5"
    openhouseSparkRuntimeModule = ":integrations:spark:spark-${sparkVersionSuffix}:openhouse-spark-3.5-runtime_2.12"
    icebergSparkRuntimeModule = "com.linkedin.iceberg:iceberg-spark-runtime-3.5_2.12:${icebergVersion}"
    tablesTestFixturesModule = ":tables-test-fixtures:tables-test-fixtures-iceberg-1.5_2.12"
}

configurations.all {
    exclude group: 'com.linkedin.iceberg', module: 'iceberg-data'
}

// Keep the Optimizer's Flyway migrations and service configuration out of the Spark unit tests.
sourceSets {
    lifecycleTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    lifecycleTestImplementation.extendsFrom testImplementation
    lifecycleTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    compileOnly (project(path: openhouseSparkRuntimeModule)) {
        exclude group: 'io.netty'
        exclude group: 'org.apache.hadoop', module: 'hadoop-common'
        exclude group: 'org.apache.hadoop', module: 'hadoop-client'
    }

    implementation "org.apache.logging.log4j:log4j-slf4j-impl:${log4jVersion}"
    implementation(project(':libs:datalayout')) {
        exclude group: 'com.linkedin.iceberg', module: 'iceberg-spark-runtime-3.1_2.12'
    }
    // Exclude log4j-slf4j2-impl: incompatible with the log4j-slf4j-impl (1.x) bridge this app ships.
    implementation(project(':libs:optimizer:binpack')) {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'
    }
    implementation ('org.apache.spark:spark-core_2.12:' + sparkVersion) {
        exclude group: 'io.netty'
        exclude group: 'org.apache.hadoop', module: 'hadoop-common'
        exclude group: 'org.apache.hadoop', module: 'hadoop-client'
    }
    implementation ('org.apache.spark:spark-sql_2.12:' + sparkVersion) {
        exclude group: 'io.netty'
        exclude group: 'org.apache.hadoop', module: 'hadoop-common'
        exclude group: 'org.apache.hadoop', module: 'hadoop-client'
    }
    implementation (icebergSparkRuntimeModule) {
        exclude group: 'io.netty'
    }

    testImplementation (project(path: openhouseSparkRuntimeModule, configuration: 'shadow')) {
        exclude group: 'io.netty'
        exclude group: 'org.apache.hadoop', module: 'hadoop-common'
        exclude group: 'org.apache.hadoop', module: 'hadoop-client'
    }
    testImplementation(project(tablesTestFixturesModule)) {
        exclude group: "io.netty"
    }
    lifecycleTestImplementation project(':services:optimizer')
    lifecycleTestImplementation project(':libs:optimizer:scheduler')
    lifecycleTestImplementation project(':libs:optimizer:analyzer')
    lifecycleTestImplementation 'org.awaitility:awaitility:4.2.0'
    lifecycleTestImplementation 'org.testcontainers:mysql:1.21.4'
    lifecycleTestCompileOnly project(path: tablesTestFixturesModule, configuration: 'runtimeElements')
    lifecycleTestRuntimeOnly 'org.flywaydb:flyway-mysql:8.5.13'
}

tasks.register('lifecycleTest', Test) {
    description = 'Runs the temporary-table lifecycle with local Spark, HTTP services, and MySQL.'
    group = 'verification'
    testClassesDirs = sourceSets.lifecycleTest.output.classesDirs
    classpath = sourceSets.lifecycleTest.runtimeClasspath
    jvmArgs tasks.named('test').get().jvmArgs
}

tasks.named('check') {
    dependsOn tasks.named('lifecycleTest')
}

// because we depend on project(':apps:openhouse-spark-apps_2.12').sourceSets
evaluationDependsOn(':apps:openhouse-spark-apps_2.12')
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', project(':apps:openhouse-spark-apps_2.12').sourceSets.main.java.srcDirs]
        }
    }
    test {
        java {
            srcDirs = ['src/test/java', project(':apps:openhouse-spark-apps_2.12').sourceSets.test.java.srcDirs]
        }
    }
}
