spring.application.name=openhouse-optimizer-analyzer
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.datasource.url=${OPTIMIZER_DB_URL:jdbc:h2:mem:analyzerdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${OPTIMIZER_DB_USER:sa}
spring.datasource.password=${OPTIMIZER_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
# Per-analyzer enablement (staged rollout): stats collection ships first; OFD stays off until
# explicitly enabled. These deployment-wide flags gate whether each analyzer bean is created at
# all — distinct from the per-table opt-in table properties (maintenance.optimizer.*.enabled).
# Overridable per deployment via env vars (e.g. K8s CronJob env ANALYZER_OFD_ENABLED=true).
analyzer.stats.enabled=${ANALYZER_STATS_ENABLED:true}
analyzer.ofd.enabled=${ANALYZER_OFD_ENABLED:false}
ofd.success-retry-hours=${OFD_SUCCESS_RETRY_HOURS:16}
ofd.failure-retry-hours=${OFD_FAILURE_RETRY_HOURS:1}
# Active-op deadline: a SCHEDULING/SCHEDULED op with no terminal result within this window is
# treated as a dead job and rescheduled. OFD mutates the table, so it biases long (avoid duplicates).
ofd.stale-timeout-hours=${OFD_STALE_TIMEOUT_HOURS:24}
# Circuit breaker: after this many consecutive failed runs, back off exponentially (capped) and
# emit an operator-visible signal instead of rescheduling every cadence.
ofd.failure-streak-threshold=${OFD_FAILURE_STREAK_THRESHOLD:3}
ofd.failure-backoff-max-hours=${OFD_FAILURE_BACKOFF_MAX_HOURS:24}
stats.success-retry-hours=${STATS_SUCCESS_RETRY_HOURS:24}
stats.failure-retry-hours=${STATS_FAILURE_RETRY_HOURS:1}
# Stats collection is idempotent, so it biases short (reschedule a stuck job sooner — extra job ok).
stats.stale-timeout-hours=${STATS_STALE_TIMEOUT_HOURS:3}
stats.failure-streak-threshold=${STATS_FAILURE_STREAK_THRESHOLD:3}
stats.failure-backoff-max-hours=${STATS_FAILURE_BACKOFF_MAX_HOURS:24}
