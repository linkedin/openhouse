spring.application.name=openhouse-optimizer-analyzer
spring.main.web-application-type=none
spring.datasource.url=${OPTIMIZER_DB_URL:jdbc:h2:mem:analyzerdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${OPTIMIZER_DB_USER:sa}
spring.datasource.password=${OPTIMIZER_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
# Analyzer runs on a fixed cadence; each cycle fans databases out across a bounded pool.
# Keep hikari.maximum-pool-size >= analyzer.db-parallelism (plus headroom) or workers block on
# connection acquisition.
# Which scan this instance performs (INCREMENTAL or FULL). Deploy two instances/CronJobs: an
# INCREMENTAL one on a frequent cron (e.g. every 30 min) and a FULL one daily. Cadence is owned by
# the external scheduler (e.g. K8s CronJob with concurrencyPolicy: Forbid), not this process.
analyzer.mode=${OPTIMIZER_ANALYZER_MODE:INCREMENTAL}
# Each cycle fans work out across a bounded pool; keep hikari.maximum-pool-size >= db-parallelism.
analyzer.db-parallelism=8
spring.datasource.hikari.maximum-pool-size=${OPTIMIZER_DB_MAX_POOL:16}
ofd.success-retry-hours=16
ofd.failure-retry-hours=1
# Safety-net sweep interval for tables with no commits since their last OFD run (data-driven gate).
ofd.max-idle-hours=168
