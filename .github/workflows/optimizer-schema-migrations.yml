name: Optimizer Schema Migrations

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, chbush/optimizer-flyway-atlas]
    paths:
      - 'libs/optimizer/optimizer-common/**'
      - 'services/optimizer/**'
      - 'buildSrc/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/optimizer-schema-migrations.yml'

concurrency:
  group: optimizer-migrations-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MIGRATIONS: libs/optimizer/optimizer-common/src/main/resources/db/migration

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.generate.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Install Atlas Community
        run: |
          curl -sSfL -o "$RUNNER_TEMP/atlas" \
            https://atlasbinaries.com/atlas/atlas-community-linux-amd64-v1.3.0
          echo "10d7913e3dce43ab99b8d71534a4cbadaf11a16dc293adf3b91d10e83a0ac70b  $RUNNER_TEMP/atlas" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/atlas" /usr/local/bin/atlas
      - name: Generate migration with Gradle
        id: generate
        run: |
          ./gradlew :services:optimizer:generateMigration
          if [ -f build/optimizer/generated-migrations/atlas.sum ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v5
        if: steps.generate.outputs.changed == 'true'
        with:
          name: optimizer-migration-${{ github.event.pull_request.number }}
          path: build/optimizer/generated-migrations
          retention-days: 7

  # Separate runner: PR code never sees a write token; this job only handles SQL as data.
  publish:
    needs: generate
    if: >-
      needs.generate.outputs.changed == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check PR head and validation dispatch
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '[.state, .head.sha, .head.ref, .head.repo.full_name] | join(" ")')" \
            = "open $EXPECTED_SHA $PR_BRANCH $GITHUB_REPOSITORY"
          test "$PR_BRANCH" != "$DEFAULT_BRANCH"
          for ref in "$DEFAULT_BRANCH" "$EXPECTED_SHA"; do
            gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/pr-validations.yml?ref=$ref" \
              --jq .content | base64 --decode | grep -q '^  workflow_dispatch:' || {
              echo '::error::Merge the validation dispatch setup to the default branch and rebase first.'
              exit 1
            }
          done
      - uses: actions/download-artifact@v5
        with:
          name: optimizer-migration-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/optimizer-migration
      - name: Accept only a new migration and checksums
        run: |
          shopt -s nullglob dotglob
          files=("$RUNNER_TEMP/optimizer-migration"/*)
          sql=("$RUNNER_TEMP/optimizer-migration"/V*__sync_entities.sql)
          test "${#files[@]}" -eq 2
          test "${#sql[@]}" -eq 1
          test -s "$RUNNER_TEMP/optimizer-migration/atlas.sum"
          for file in "${files[@]}"; do
            test -f "$file"
            test ! -L "$file"
            size=$(wc -c < "$file")
            test "$size" -gt 0
            test "$size" -le 1048576
          done
          name=${sql[0]##*/}
          [[ "$name" =~ ^V[0-9]{14}__sync_entities\.sql$ ]] || exit 1
          for old in "$MIGRATIONS"/V*__*.sql; do
            old=${old##*/}
            [[ "${name%%__*}" > "${old%%__*}" ]] || exit 1
          done
          test "$(realpath "$MIGRATIONS")" = "$GITHUB_WORKSPACE/$MIGRATIONS"
          test ! -L "$MIGRATIONS/atlas.sum"
          test ! -e "$MIGRATIONS/$name"
          mv "${files[@]}" "$MIGRATIONS/"
      - uses: stefanzweifel/git-auto-commit-action@v7
        id: commit
        with:
          commit_message: Generate optimizer schema migration
          branch: ${{ github.event.pull_request.head.ref }}
          file_pattern: ${{ env.MIGRATIONS }}
          skip_fetch: true
          skip_checkout: true
      - name: Validate bot commit
        if: steps.commit.outputs.changes_detected == 'true'
        run: gh workflow run pr-validations.yml --repo "$GITHUB_REPOSITORY" --ref "$PR_BRANCH" -f pr_number="$PR_NUMBER"
