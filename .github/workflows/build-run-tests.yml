name: Gradle Build and Run Tests

on:
  workflow_call: # Allow to be run by other workflows

jobs:
  build-and-run-tests:
    name: Build and Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v6

      # Protect merged migration files before deployment: only additions to the base's directory pass.
      - name: Check merged optimizer migrations are unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --exit-code --stat --diff-filter=DMRT "$BASE_SHA" HEAD -- \
            libs/optimizer/optimizer-common/src/main/resources/db/migration

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Start Docker Containers
        run: docker compose -f infra/recipes/docker-compose/oh-only/docker-compose.yml up -d --build

      - name: Wait for Docker Containers to be ready
        run: |
          echo "Waiting for openhouse-tables and openhouse-housetables..."
          token=$(cat ./tables-test-fixtures/tables-test-fixtures-iceberg-1.2/src/main/resources/dummy.token)
          probe() {
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 --max-time 5 "$@") && printf '%s' "$status" || printf '000'
          }
          SECONDS=0
          i=0
          while [ "$SECONDS" -lt 300 ]; do
            i=$((i + 1))
            tables_status=$(probe -H "Authorization: Bearer $token" http://localhost:8000/v1/databases)
            hts_status=$(probe http://localhost:8001/hts/tables/query)
            echo "Poll $i: tables=$tables_status hts=$hts_status"
            if [ "$tables_status" = "200" ] && [ "$hts_status" = "200" ]; then
              echo "Services ready after ${SECONDS}s"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for services after 300s"
          docker compose -f infra/recipes/docker-compose/oh-only/docker-compose.yml ps
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/python/requirements.txt

      - name: Run Integration Tests
        run: python scripts/python/integration_test.py ./tables-test-fixtures/tables-test-fixtures-iceberg-1.2/src/main/resources/dummy.token

      - name: Stop Docker Containers
        if: always()
        run: docker compose -f infra/recipes/docker-compose/oh-only/docker-compose.yml down