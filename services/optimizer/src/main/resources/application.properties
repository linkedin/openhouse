spring.application.name=openhouse-optimizer-service
server.port=8080

# Flyway, not Hibernate, creates and changes the tables: it applies the migrations in
# classpath:db/migration before JPA starts (docs/development/optimizer-schema-migrations.md).
spring.jpa.hibernate.ddl-auto=validate
# The tables can share a database with HouseTables'. Flyway records the migrations in a history
# table of the optimizer's own. Where the service's user sees other tables but no history yet,
# Flyway first records a baseline at version 0; every migration has a higher version, so all run.
spring.flyway.table=optimizer_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Flyway's clean drops every table in the database, HouseTables' included.
spring.flyway.clean-disabled=true
# Migrations are named by timestamp on their branches, so one can merge after a migration with a
# later version has already run; apply it instead of refusing to start.
spring.flyway.out-of-order=true
# A rolled-back release has no files for migrations applied after it. Validation skips those:
# future ones, above its newest version, and missing ones, below it, as a late migration is.
# It skips a deleted migration file the same way, so the PR build rejects deletions instead.
spring.flyway.ignore-migration-patterns=*:future,*:missing
# Fail on a file in db/migration that Flyway would otherwise skip silently for its name.
spring.flyway.validate-migration-naming=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.datasource.url=${OPTIMIZER_DB_URL:jdbc:mysql://localhost:3306/oh_db}
spring.datasource.username=${OPTIMIZER_DB_USER:oh_user}
spring.datasource.password=${OPTIMIZER_DB_PASSWORD:oh_password}
spring.datasource.hikari.maximum-pool-size=20

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.enabled=true
# Publish timers (HTTP requests, connection pool, repositories) as histograms, as tables, housetables
# and jobs do. Summaries carry only count, sum and max, so latency percentiles can't be computed.
management.metrics.distribution.percentiles-histogram.all=true

# Commit-driven analysis runs the analyzers in-process on each stats upsert. Per-analyzer
# enablement (staged rollout): stats collection first; OFD stays off until explicitly enabled.
# Overridable per deployment via env vars (e.g. ANALYZER_OFD_ENABLED=true).
analyzer.stats.enabled=${ANALYZER_STATS_ENABLED:true}
analyzer.ofd.enabled=${ANALYZER_OFD_ENABLED:false}

# Failure-handling policy, per operation type (same knobs the scheduled analyzer app exposes, so the
# commit-driven path is tunable identically). success/failure-retry = cadence; stale-timeout =
# active-op deadline after which a dead/hung SCHEDULED job is rescheduled; failure-streak-threshold
# = consecutive failures that engage exponential backoff; failure-backoff-max = backoff ceiling.
stats.success-retry-hours=${STATS_SUCCESS_RETRY_HOURS:24}
stats.failure-retry-hours=${STATS_FAILURE_RETRY_HOURS:1}
stats.stale-timeout-hours=${STATS_STALE_TIMEOUT_HOURS:3}
stats.failure-streak-threshold=${STATS_FAILURE_STREAK_THRESHOLD:3}
stats.failure-backoff-max-hours=${STATS_FAILURE_BACKOFF_MAX_HOURS:21}
ofd.success-retry-hours=${OFD_SUCCESS_RETRY_HOURS:16}
ofd.failure-retry-hours=${OFD_FAILURE_RETRY_HOURS:1}
ofd.stale-timeout-hours=${OFD_STALE_TIMEOUT_HOURS:24}
ofd.failure-streak-threshold=${OFD_FAILURE_STREAK_THRESHOLD:3}
ofd.failure-backoff-max-hours=${OFD_FAILURE_BACKOFF_MAX_HOURS:24}

# Include ResponseStatusException.reason in the default error response body. Without this, Spring
# Boot 2.7 omits the `message` field, and the human-readable detail from a thrown
# ResponseStatusException never reaches the caller.
server.error.include-message=always
