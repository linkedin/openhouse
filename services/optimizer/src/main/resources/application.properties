spring.application.name=openhouse-optimizer-service
server.port=8080

# Flyway, not Hibernate, creates and changes the tables: it applies the migrations in
# classpath:db/migration before JPA starts (docs/development/optimizer-schema-migrations.md).
spring.jpa.hibernate.ddl-auto=none
# The tables can share a database with HouseTables'. Flyway records the migrations in a history
# table of the optimizer's own. Where the service's user sees other tables but no history yet,
# Flyway first records a baseline at version 0; every migration has a higher version, so all run.
spring.flyway.table=optimizer_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Flyway's clean drops every table in the database, HouseTables' included.
spring.flyway.clean-disabled=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.datasource.url=${OPTIMIZER_DB_URL:jdbc:mysql://localhost:3306/oh_db}
spring.datasource.username=${OPTIMIZER_DB_USER:oh_user}
spring.datasource.password=${OPTIMIZER_DB_PASSWORD:oh_password}
spring.datasource.hikari.maximum-pool-size=20

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.enabled=true

# Commit-driven analysis runs the analyzers in-process on each stats upsert. Per-analyzer
# enablement (staged rollout): stats collection first; OFD stays off until explicitly enabled.
# Overridable per deployment via env vars (e.g. ANALYZER_OFD_ENABLED=true).
analyzer.stats.enabled=${ANALYZER_STATS_ENABLED:true}
analyzer.ofd.enabled=${ANALYZER_OFD_ENABLED:false}

# Include ResponseStatusException.reason in the default error response body. Without this, Spring
# Boot 2.7 omits the `message` field, and the human-readable detail from a thrown
# ResponseStatusException never reaches the caller.
server.error.include-message=always
