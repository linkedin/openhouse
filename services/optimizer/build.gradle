plugins {
  id 'openhouse.springboot-ext-conventions'
  id 'openhouse.maven-publish'
  id 'org.springframework.boot' version '2.7.8'
  // OpenAPI spec generation for :client:optimizerclient.
  id 'com.github.johnrengelman.processes' version '0.5.0'
  id 'org.springdoc.openapi-gradle-plugin' version '1.6.0'
  id 'openhouse.service-specgen-convention'
}

// Port allocation: tables 8000, housetables 8001, jobs 8002, optimizer 8003.
// H2 overrides let the Spring context finish startup so springdoc can extract the spec. Schema
// migration and validation stay off: this spec-only database has no tables.
openApi {
  customBootRun {
    args = [
      "--server.port=8003",
      "--cluster.optimizer.database.url=jdbc:h2:mem:codegen;MODE=MYSQL;DB_CLOSE_DELAY=-1",
      "--cluster.optimizer.database.type=IN_MEMORY",
      "--cluster.optimizer.database.cert-based-auth.enabled=false",
      "--spring.datasource.username=sa",
      "--spring.datasource.password=",
      "--spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect",
      "--spring.jpa.hibernate.ddl-auto=none",
      "--spring.flyway.enabled=false"
    ]
  }
  apiDocsUrl.set("http://localhost:8003/v3/api-docs")
}

dependencies {
  implementation project(':libs:optimizer:optimizer-common')
  // Host the analyzer beans in the service process so a stats upsert can trigger commit-driven
  // analysis in-process (AnalyzerRunner implements the CommitTriggeredAnalyzer SPI). No cycle: the
  // analyzer depends on :libs:optimizer:optimizer-common, not on this module.
  implementation project(':libs:optimizer:analyzer')
  implementation 'io.projectreactor:reactor-core:3.4.26'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa:2.7.8'
  implementation 'com.vladmihalcea:hibernate-types-55:2.21.1'
  implementation 'org.springframework.boot:spring-boot-starter-web:2.7.8'
  implementation 'mysql:mysql-connector-java:8.+'
  // Applies the migrations in :libs:optimizer:optimizer-common at startup, before JPA. 8.5.13 is the
  // Flyway release Spring Boot 2.7 is built against.
  implementation 'org.flywaydb:flyway-core:8.5.13'
  runtimeOnly 'org.flywaydb:flyway-mysql:8.5.13'
  // H2 only for spec-gen bootRun; excluded from bootJar. Pinned to 2.1.210 (matches
  // :iceberg:openhouse:htscatalog) — 2.2.x switches to slf4j-api 2.x and breaks downstream bridges.
  developmentOnly 'com.h2database:h2:2.1.210'
  testImplementation 'org.springframework.boot:spring-boot-starter-test:2.7.8'
  // MySqlContainerInitializer: each Spring test context runs on a new MySQL container.
  testImplementation testFixtures(project(':libs:optimizer:optimizer-common'))
}

// Reuse HouseTables' schema without adding its service to the optimizer's test classpath.
def houseTablesSchema = rootProject.file('services/housetables/src/main/resources/schema.sql')

// The DDL of the tables the entities define, where libs/optimizer/optimizer-common/atlas.hcl reads it.
def entitySchema = layout.buildDirectory.file('entity-schema.sql')

// Has Hibernate write the entities' DDL from an in-memory H2 database: no migrations, Docker, passing
// tests or production credentials needed, so it works while the committed migrations are behind.
tasks.register('exportEntitySchema', JavaExec) {
  group = 'verification'
  description = 'Writes the DDL of the tables the JPA entities define to build/entity-schema.sql'
  classpath = sourceSets.main.runtimeClasspath + configurations.developmentOnly
  mainClass = 'com.linkedin.openhouse.optimizer.OptimizerServiceApplication'
  outputs.file(entitySchema)
  doFirst {
    def file = entitySchema.get().asFile
    delete(file)
    file.parentFile.mkdirs()
    args = [
      '--spring.main.web-application-type=none',
      '--cluster.optimizer.database.url=jdbc:h2:mem:entity-schema;MODE=MYSQL;DB_CLOSE_DELAY=-1',
      '--cluster.optimizer.database.type=IN_MEMORY',
      '--cluster.optimizer.database.cert-based-auth.enabled=false',
      '--spring.datasource.username=sa',
      '--spring.datasource.password=',
      '--spring.flyway.enabled=false',
      '--spring.jpa.hibernate.ddl-auto=none',
      '--spring.jpa.properties.javax.persistence.schema-generation.database.action=none',
      '--spring.jpa.properties.javax.persistence.schema-generation.scripts.action=create',
      "--spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=${file}",
      '--spring.jpa.properties.hibernate.hbm2ddl.schema-generation.script.append=false',
      '--spring.jpa.properties.hibernate.hbm2ddl.delimiter=;'
    ]
  }
  doLast {
    if (!entitySchema.get().asFile.isFile()) {
      throw new GradleException("Hibernate did not write ${entitySchema.get().asFile}")
    }
  }
}

def optimizerCommon = project(':libs:optimizer:optimizer-common')
def migrations = optimizerCommon.file('src/main/resources/db/migration')

// Atlas Community (Apache 2.0) writes the migrations. Gradle downloads the CLI built for this
// machine and checks it against the SHA-256 that Ariga publishes beside it, at
// https://atlasbinaries.com/atlas/atlas-community-<platform>-v<version>.sha256, so neither CI nor
// developers install Atlas.
def atlasVersion = '1.3.0'
def atlasSha256 = [
  'darwin-amd64': '650981a024301775ec964e5134e2d5712b7ef1b25fec4b2ec54bad762b4bdf6f',
  'darwin-arm64': '4e5ffdc10b2b4fd3a06074aba72848150907d5316cacad7b19bae6c6ae3db991',
  'linux-amd64': '10d7913e3dce43ab99b8d71534a4cbadaf11a16dc293adf3b91d10e83a0ac70b',
  'linux-arm64': '082188c57a53439596a3ee52173b12e785aa83ec718505674e2052db0fec0c4c'
]
def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def osArch = System.getProperty('os.arch')
def atlasPlatform = [
  osName.startsWith('mac') ? 'darwin' : osName.startsWith('linux') ? 'linux' : osName,
  osArch in ['aarch64', 'arm64'] ? 'arm64' : osArch in ['amd64', 'x86_64'] ? 'amd64' : osArch
].join('-')

repositories {
  exclusiveContent {
    forRepository {
      ivy {
        name = 'AtlasCommunity'
        url = 'https://atlasbinaries.com/atlas'
        patternLayout { artifact '[artifact]-[classifier]-v[revision]' }
        metadataSources { artifact() }
      }
    }
    filter { includeModule('io.atlasgo', 'atlas-community') }
  }
}

configurations {
  atlasCli {
    canBeConsumed = false
    transitive = false
  }
}

dependencies {
  if (atlasSha256.containsKey(atlasPlatform)) {
    atlasCli "io.atlasgo:atlas-community:${atlasVersion}:${atlasPlatform}@bin"
  }
}

def atlasExecutable = layout.buildDirectory.file('atlas/atlas').get().asFile

tasks.register('installAtlas', Sync) {
  description = "Installs Atlas Community ${atlasVersion} for ${atlasPlatform} after checking its SHA-256"
  from configurations.atlasCli
  into atlasExecutable.parentFile
  rename { atlasExecutable.name }
  filePermissions { unix('rwxr-xr-x') }
  doFirst {
    def expected = atlasSha256[atlasPlatform]
    if (expected == null) {
      throw new GradleException(
          "No Atlas Community ${atlasVersion} checksum for ${atlasPlatform} in services/optimizer/build.gradle")
    }
    def actual = configurations.atlasCli.singleFile.bytes.sha256()
    if (actual != expected) {
      throw new GradleException(
          "Atlas Community ${atlasVersion} for ${atlasPlatform} has SHA-256 ${actual}, not ${expected}")
    }
  }
}

def migrationName = providers.gradleProperty('migrationName').getOrElse('sync_entities')

// Explicit authoring only; no build, check or test runs it. Atlas diffs the entities' exported DDL
// against the migrations and writes a candidate Flyway migration into optimizer-common. The diff is
// of desired state, so it can propose drops and must be reviewed and edited by hand. Atlas's undo
// scripts are removed because Flyway Community can't apply them.
tasks.register('generateMigration', Exec) {
  group = 'database'
  description = 'Drafts migration SQL for entity changes; review the SQL, then commit it with the entity change'
  dependsOn tasks.named('exportEntitySchema'), tasks.named('installAtlas')
  workingDir optimizerCommon.projectDir
  executable atlasExecutable
  args 'migrate', 'diff', '--env', 'local', migrationName
  Set<String> before = [] as Set
  doFirst {
    before = fileTree(migrations).files.collect { it.name } as Set
  }
  doLast {
    def undo = fileTree(migrations).files.findAll { it.name.startsWith('U') && !before.contains(it.name) }
    if (!undo.isEmpty()) {
      delete undo
      providers.exec {
        workingDir optimizerCommon.projectDir
        commandLine atlasExecutable, 'migrate', 'hash', '--env', 'local'
      }.result.get().assertNormalExitValue()
    }
  }
}

// Atlas fails until atlas.sum matches the migrations.
tasks.register('hashMigrations', Exec) {
  group = 'database'
  description = 'Updates atlas.sum after a migration is added or edited by hand'
  dependsOn tasks.named('installAtlas')
  workingDir optimizerCommon.projectDir
  executable atlasExecutable
  args 'migrate', 'hash', '--env', 'local'
}

test {
  useJUnitPlatform()
  dependsOn tasks.named('exportEntitySchema')
  inputs.file(houseTablesSchema).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file(entitySchema).withPathSensitivity(PathSensitivity.NONE)
  doFirst {
    // Set here, not as inputs: the absolute paths differ between checkouts that share the build
    // cache.
    systemProperty 'optimizer.house-tables-schema', houseTablesSchema.absolutePath
    systemProperty 'optimizer.entity-schema', entitySchema.get().asFile.absolutePath
  }
}
