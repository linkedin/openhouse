plugins {
  id 'openhouse.springboot4-ext-conventions'
  id 'openhouse.maven-publish'
  id 'org.springframework.boot' version '4.1.1'
  // OpenAPI spec generation for :client:optimizerclient.
  id 'com.github.johnrengelman.processes' version '0.5.0'
  id 'org.springdoc.openapi-gradle-plugin' version '1.6.0'
  id 'openhouse.service-specgen-convention'
}

// Port allocation: tables 8000, housetables 8001, jobs 8002, optimizer 8003.
// The spec needs no database: the schema script doesn't run, and Hibernate takes its MySQL dialect
// from these settings instead of from a connection, so the context starts and springdoc can serve
// the spec.
openApi {
  customBootRun {
    args = [
      "--server.port=8003",
      "--spring.sql.init.mode=never",
      "--spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false",
      "--spring.jpa.properties.jakarta.persistence.database-product-name=MySQL",
      "--spring.jpa.properties.jakarta.persistence.database-major-version=8"
    ]
  }
  apiDocsUrl.set("http://localhost:8003/v3/api-docs")
}

// With the Spring Boot 4 plugin, springdoc's forked run reads the runtime classpath without
// depending on the tasks that build the project jars on it. springdoc registers the task after
// this script runs.
tasks.matching { it.name == 'forkedSpringBootRun' }.configureEach {
  dependsOn sourceSets.main.runtimeClasspath
}

dependencies {
  implementation project(':libs:optimizer:optimizer-common')
  // Host the analyzer beans in the service process so a stats upsert can trigger commit-driven
  // analysis in-process (AnalyzerRunner implements the CommitTriggeredAnalyzer SPI). No cycle: the
  // analyzer depends on :libs:optimizer:optimizer-common, not on this module.
  implementation project(':libs:optimizer:analyzer')
  implementation 'io.projectreactor:reactor-core'
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
  runtimeOnly 'com.mysql:mysql-connector-j'
  runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testRuntimeOnly 'com.h2database:h2'
}
