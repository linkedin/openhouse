plugins {
  id 'openhouse.springboot-ext-conventions'
  id 'openhouse.hadoop-conventions'
  id 'openhouse.iceberg-aws-conventions'
  id 'openhouse.iceberg-azure-conventions'
  id 'openhouse.iceberg-conventions-1.5.2'
  id 'openhouse.maven-publish'
  /**
   * FIXME: Ideally, the below line are also defined in shared buildSrc. But raises following error:
   * Invalid plugin request [id: 'org.springframework.boot', version: '2.1.2.RELEASE'].
   * Plugin requests from precompiled scripts must not include a version number.
   * Please remove the version from the offending request and make sure the module
   * containing the requested plugin 'org.springframework.boot' is an implementation dependency.
   */
  id 'org.springframework.boot' version '2.7.8'

  /**
   * These are the dependencies to enable client generation for the service.
   * */
  id 'com.github.johnrengelman.processes' version '0.5.0'
  id 'org.springdoc.openapi-gradle-plugin' version '1.6.0'
  id 'openhouse.service-specgen-convention'
}

// Configure unique port for OpenAPI spec generation to avoid conflicts during parallel builds
openApi {
  customBootRun {
    args = ["--server.port=8000"]
  }
  apiDocsUrl.set("http://localhost:8000/v3/api-docs")
}

def icebergRestSpec = file("${rootDir}/spec/iceberg-rest-catalog-open-api.yaml")
// Checked-in Phase 1 read-only profile derived from apache-iceberg-1.11.0 (see header in the YAML).
def icebergRestSpecSha256 = "47b504483d3f3a9fe2542f32b0d97d35409f93b28ce1f2036a1fdd07c998e70c"
def openApiCliVersion = "7.12.0"
def generatedIcebergRestDir = "${buildDir}/generated/openapi/iceberg-rest-server"

/**
 * The runtime Iceberg library has hand-written response classes that predate parts of the 1.11
 * REST contract. Compatible classes are reused directly. Config and list-table responses are
 * generated because the 1.5.2 runtime types do not expose endpoint capabilities or pagination
 * tokens.
 *
 * Codegen uses the checked-in Phase 1 read-only OpenAPI profile in
 * spec/iceberg-rest-catalog-open-api.yaml. That file is held constant; see its header for the
 * upstream 1.11.0 provenance and how to diff against Apache Iceberg.
 */
// importMappings controls the `import` statement in generated files.
// typeMappings controls the inline type name in method signatures and @Schema annotations.
// Both are needed due to an openapi-generator bug — setting one does not update the other.
def icebergImportMappings = [
    "ErrorModel=org.apache.iceberg.rest.responses.ErrorResponse",
    "IcebergErrorResponse=org.apache.iceberg.rest.responses.ErrorResponse",
    "LoadTableResult=org.apache.iceberg.rest.responses.LoadTableResponse",
    "TableIdentifier=org.apache.iceberg.catalog.TableIdentifier",
].join(",")

def icebergTypeMappings = [
    "ErrorModel=org.apache.iceberg.rest.responses.ErrorResponse",
    "IcebergErrorResponse=org.apache.iceberg.rest.responses.ErrorResponse",
    "LoadTableResult=org.apache.iceberg.rest.responses.LoadTableResponse",
    "TableIdentifier=org.apache.iceberg.catalog.TableIdentifier",
].join(",")

configurations {
  icebergRestOpenApiGenerator {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
  }
}

dependencies {
  icebergRestOpenApiGenerator "org.openapitools:openapi-generator-cli:${openApiCliVersion}"
  compileOnly "io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations:${otel_annotations_version}"
  api project(':services:common')
  api project(':iceberg:openhouse:internalcatalog')
  api project(':client:hts')
  api project(':cluster:configs')
  api project(':cluster:storage')
  api project(':cluster:metrics')
  api 'org.springframework.security:spring-security-config:5.7.2'
  api 'org.springframework.boot:spring-boot-starter-webflux:2.7.8'
  implementation 'com.cronutils:cron-utils:9.2.0'
  testImplementation 'org.junit.jupiter:junit-jupiter-engine:' + junit_version
  testImplementation 'org.springframework.security:spring-security-test:5.7.3'
  testImplementation(testFixtures(project(':services:common')))
  testImplementation (project(':tables-test-fixtures:tables-test-fixtures_2.12')) {
    exclude group: 'com.linkedin.iceberg'
  }
}

tasks.register('icebergRestVerifySpec') {
  description = 'Verify the checked-in Iceberg REST OpenAPI profile checksum'
  inputs.file(icebergRestSpec)
  doLast {
    def actualSha256 = java.security.MessageDigest.getInstance("SHA-256")
        .digest(icebergRestSpec.bytes)
        .encodeHex()
        .toString()
    if (actualSha256 != icebergRestSpecSha256) {
      throw new IllegalStateException(
          "Iceberg REST OpenAPI profile checksum ${actualSha256} does not match the pinned " +
          "apache-iceberg-1.11.0 Phase 1 profile checksum ${icebergRestSpecSha256}. " +
          "Update the YAML and the pinned checksum together.")
    }
  }
}

tasks.register('icebergRestValidateSpec', JavaExec) {
  dependsOn tasks.named('icebergRestVerifySpec')
  classpath = configurations.icebergRestOpenApiGenerator
  mainClass.set("org.openapitools.codegen.OpenAPIGenerator")
  args "validate", "-i", icebergRestSpec.absolutePath
  inputs.file(icebergRestSpec)
  inputs.files(configurations.icebergRestOpenApiGenerator)
}

tasks.register('icebergRestCodegen', JavaExec) {
  dependsOn tasks.named('icebergRestValidateSpec')
  doFirst {
    delete generatedIcebergRestDir
  }
  classpath = configurations.icebergRestOpenApiGenerator
  mainClass.set("org.openapitools.codegen.OpenAPIGenerator")
  args "generate",
      "-g", "spring",
      "-i", icebergRestSpec.absolutePath,
      "-o", generatedIcebergRestDir,
      "--api-package", "com.linkedin.openhouse.tables.generated.iceberg.api",
      "--model-package", "com.linkedin.openhouse.tables.generated.iceberg.model",
      "--import-mappings", icebergImportMappings,
      "--type-mappings", icebergTypeMappings,
      "--global-property",
      "apis,models=CatalogConfig:ListTablesResponse,apiTests=false,apiDocs=false,modelTests=false,modelDocs=false,supportingFiles=",
      "--additional-properties",
      "interfaceOnly=true,useTags=true,skipDefaultInterface=false,hideGenerationTimestamp=true,useSpringBoot3=false,openApiNullable=false"
  inputs.file(icebergRestSpec)
  inputs.files(configurations.icebergRestOpenApiGenerator)
  outputs.dir(generatedIcebergRestDir)
}

tasks.named('compileJava') {
  dependsOn tasks.named('icebergRestCodegen')
  source "${generatedIcebergRestDir}/src/main/java"
}

tasks.named('check') {
  dependsOn tasks.named('icebergRestValidateSpec')
}
