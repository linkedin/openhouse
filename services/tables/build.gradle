plugins {
  id 'openhouse.springboot-ext-conventions'
  id 'openhouse.hadoop-conventions'
  id 'openhouse.iceberg-aws-conventions'
  id 'openhouse.iceberg-azure-conventions'
  id 'openhouse.iceberg-conventions-1.5.2'
  id 'openhouse.maven-publish'
  /**
   * FIXME: Ideally, the below line are also defined in shared buildSrc. But raises following error:
   * Invalid plugin request [id: 'org.springframework.boot', version: '2.1.2.RELEASE'].
   * Plugin requests from precompiled scripts must not include a version number.
   * Please remove the version from the offending request and make sure the module
   * containing the requested plugin 'org.springframework.boot' is an implementation dependency.
   */
  id 'org.springframework.boot' version '2.7.8'

  /**
   * These are the dependencies to enable client generation for the service.
   * */
  id 'com.github.johnrengelman.processes' version '0.5.0'
  id 'org.springdoc.openapi-gradle-plugin' version '1.6.0'
  id 'openhouse.service-specgen-convention'
}

// Configure unique port for OpenAPI spec generation to avoid conflicts during parallel builds
openApi {
  customBootRun {
    args = ["--server.port=8000"]
  }
  apiDocsUrl.set("http://localhost:8000/v3/api-docs")
}

/**
 * Iceberg REST OpenAPI is checked in at spec/iceberg-rest-catalog-open-api.yaml (full Apache
 * Iceberg contract). Each operation declares OpenHouse support with:
 *
 *   x-openhouse-support: supported | unsupported
 *
 * The build asserts every operation is annotated, codegens only supported operations into Spring
 * interfaces, and emits IcebergRestOpenHouseSupport.SUPPORTED_ENDPOINTS for /v1/config. Marking a
 * new operation supported (or changing a supported signature) fails compilation until the facade
 * implements it. Upgrade by merging a newer Iceberg OpenAPI into the YAML and annotating new ops.
 */
def icebergRestSpec = file("${rootDir}/spec/iceberg-rest-catalog-open-api.yaml")
def icebergRestSpecSha256 = "96acc943e2c5986a9df961129c49f84a21aaa916e753758933087a616b843940"
def openApiCliVersion = "7.12.0"
def generatedIcebergRestDir = "${buildDir}/generated/openapi/iceberg-rest-server"
def icebergRestCodegenSpec = file("${buildDir}/iceberg-rest/codegen-open-api.yaml")
def icebergRestSupportJavaDir = file("${buildDir}/generated/openapi/iceberg-rest-support/src/main/java")

def icebergHttpMethods = ['get', 'post', 'put', 'patch', 'delete', 'head', 'options', 'trace'] as Set

// importMappings controls the `import` statement in generated files.
// typeMappings controls the inline type name in method signatures and @Schema annotations.
// Both are needed due to an openapi-generator bug — setting one does not update the other.
def icebergImportMappings = [
    "ErrorModel=org.apache.iceberg.rest.responses.ErrorResponse",
    "IcebergErrorResponse=org.apache.iceberg.rest.responses.ErrorResponse",
    "LoadTableResult=org.apache.iceberg.rest.responses.LoadTableResponse",
    "TableIdentifier=org.apache.iceberg.catalog.TableIdentifier",
].join(",")

def icebergTypeMappings = [
    "ErrorModel=org.apache.iceberg.rest.responses.ErrorResponse",
    "IcebergErrorResponse=org.apache.iceberg.rest.responses.ErrorResponse",
    "LoadTableResult=org.apache.iceberg.rest.responses.LoadTableResponse",
    "TableIdentifier=org.apache.iceberg.catalog.TableIdentifier",
].join(",")

configurations {
  icebergRestYaml {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
  }
  icebergRestOpenApiGenerator {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
  }
}

dependencies {
  icebergRestYaml 'org.yaml:snakeyaml:2.2'
  icebergRestOpenApiGenerator "org.openapitools:openapi-generator-cli:${openApiCliVersion}"
  compileOnly "io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations:${otel_annotations_version}"
  api project(':services:common')
  api project(':iceberg:openhouse:internalcatalog')
  api project(':client:hts')
  api project(':cluster:configs')
  api project(':cluster:storage')
  api project(':cluster:metrics')
  api 'org.springframework.security:spring-security-config:5.7.2'
  api 'org.springframework.boot:spring-boot-starter-webflux:2.7.8'
  implementation 'com.cronutils:cron-utils:9.2.0'
  testImplementation 'org.junit.jupiter:junit-jupiter-engine:' + junit_version
  testImplementation 'org.springframework.security:spring-security-test:5.7.3'
  testImplementation(testFixtures(project(':services:common')))
  testImplementation (project(':tables-test-fixtures:tables-test-fixtures_2.12')) {
    exclude group: 'com.linkedin.iceberg'
  }
}

ext.icebergRestYaml = {
  def urls = configurations.icebergRestYaml.files.collect { it.toURI().toURL() } as URL[]
  def loader = new URLClassLoader(urls, ClassLoader.systemClassLoader)
  return loader.loadClass('org.yaml.snakeyaml.Yaml').getDeclaredConstructor().newInstance()
}

ext.loadIcebergRestSpec = {
  icebergRestSpec.withInputStream { input -> icebergRestYaml().load(input) as Map }
}

ext.collectIcebergRefs = { value, refs ->
  if (value instanceof Map) {
    def reference = value.get('$ref')
    if (reference instanceof String) {
      refs.add(reference)
    }
    value.values().each { collectIcebergRefs(it, refs) }
  } else if (value instanceof List) {
    value.each { collectIcebergRefs(it, refs) }
  }
}

ext.resolveIcebergRef = { Map spec, String reference ->
  def value = spec
  reference.replaceFirst(/^#\//, '').split('/').each { part ->
    value = value[part.replace('~1', '/').replace('~0', '~')]
  }
  return value
}

ext.referencedIcebergComponents = { Map spec, Map paths ->
  def references = [] as Set
  collectIcebergRefs(paths, references)
  def pending = new ArrayDeque(references)
  while (!pending.isEmpty()) {
    def reference = pending.removeFirst()
    def nested = [] as Set
    collectIcebergRefs(resolveIcebergRef(spec, reference), nested)
    nested.each { candidate ->
      if (references.add(candidate)) {
        pending.add(candidate)
      }
    }
  }
  def components = [:]
  references.sort().each { reference ->
    def parts = reference.replaceFirst(/^#\/components\//, '').split('/', 2)
    if (parts.length != 2) {
      return
    }
    def section = parts[0]
    def name = parts[1]
    if (!components.containsKey(section)) {
      components[section] = [:]
    }
    components[section][name] = spec.components[section][name]
  }
  if (spec.security && spec.components?.securitySchemes) {
    components.securitySchemes = spec.components.securitySchemes
  }
  return components
}

ext.eachIcebergOperation = { Map spec, Closure body ->
  spec.paths.each { path, methods ->
    methods.each { method, operation ->
      if (method in icebergHttpMethods && operation instanceof Map) {
        body(path as String, method as String, operation as Map)
      }
    }
  }
}

tasks.register('icebergRestVerifySpec') {
  description = 'Verify the checked-in Iceberg REST OpenAPI checksum'
  inputs.file(icebergRestSpec)
  doLast {
    def actualSha256 = java.security.MessageDigest.getInstance("SHA-256")
        .digest(icebergRestSpec.bytes)
        .encodeHex()
        .toString()
    if (actualSha256 != icebergRestSpecSha256) {
      throw new IllegalStateException(
          "Iceberg REST OpenAPI checksum ${actualSha256} does not match the pinned checksum " +
          "${icebergRestSpecSha256}. Update the YAML and pinned checksum together after merging " +
          "upstream and annotating operations with x-openhouse-support.")
    }
  }
}

tasks.register('icebergRestAssertSupportAnnotations') {
  description = 'Assert every Iceberg REST operation declares x-openhouse-support'
  dependsOn tasks.named('icebergRestVerifySpec')
  inputs.file(icebergRestSpec)
  doLast {
    def spec = loadIcebergRestSpec()
    def missing = []
    def invalid = []
    def supported = []
    eachIcebergOperation(spec) { path, method, operation ->
      def support = operation['x-openhouse-support']
      if (support == null) {
        missing << "${method.toUpperCase()} ${path}"
      } else if (!(support in ['supported', 'unsupported'])) {
        invalid << "${method.toUpperCase()} ${path} -> ${support}"
      } else if (support == 'supported') {
        supported << "${method.toUpperCase()} ${path} (${operation.operationId})"
      }
    }
    if (!missing.isEmpty() || !invalid.isEmpty()) {
      def message = new StringBuilder(
          "Iceberg REST OpenAPI support annotations are incomplete. Mark every operation with " +
          "x-openhouse-support: supported|unsupported.\n")
      if (!missing.isEmpty()) {
        message.append("Missing:\n  - ").append(missing.join("\n  - ")).append('\n')
      }
      if (!invalid.isEmpty()) {
        message.append("Invalid:\n  - ").append(invalid.join("\n  - ")).append('\n')
      }
      throw new IllegalStateException(message.toString())
    }
    if (supported.isEmpty()) {
      throw new IllegalStateException("No Iceberg REST operations are marked x-openhouse-support: supported")
    }
    logger.lifecycle("Iceberg REST supported operations:\n  - ${supported.join('\n  - ')}")
  }
}

tasks.register('icebergRestPrepareCodegenSpec') {
  description = 'Derive the codegen OpenAPI input from supported operations in the checked-in YAML'
  dependsOn tasks.named('icebergRestAssertSupportAnnotations')
  inputs.file(icebergRestSpec)
  outputs.file(icebergRestCodegenSpec)
  outputs.dir(icebergRestSupportJavaDir)
  doLast {
    def spec = loadIcebergRestSpec()
    def paths = [:]
    def usedTags = [] as Set
    def advertisedEndpoints = []
    eachIcebergOperation(spec) { path, method, operation ->
      if (operation['x-openhouse-support'] != 'supported') {
        return
      }
      if (!paths.containsKey(path)) {
        def sourcePath = spec.paths[path]
        def profilePath = [:]
        if (sourcePath.parameters != null) {
          profilePath.parameters = sourcePath.parameters
        }
        paths[path] = profilePath
      }
      paths[path][method] = operation
      if (operation.tags instanceof List) {
        usedTags.addAll(operation.tags)
      }
      // /v1/config is required but is not part of the Iceberg endpoints advertisement list.
      if (operation.operationId != 'getConfig') {
        advertisedEndpoints << "${method.toUpperCase()} ${path}"
      }
    }

    def info = new LinkedHashMap(spec.info as Map)
    info.title = 'OpenHouse Iceberg REST Catalog (supported operations)'
    info.description =
        'Codegen input derived at build time from operations marked ' +
        'x-openhouse-support: supported in the checked-in Iceberg REST OpenAPI.'
    def codegenSpec = [
        openapi   : spec.openapi,
        info      : info,
        paths     : paths,
        components: referencedIcebergComponents(spec, paths),
    ]
    ['servers', 'security'].each { key ->
      if (spec[key] != null) {
        codegenSpec[key] = spec[key]
      }
    }
    if (spec.tags instanceof List) {
      codegenSpec.tags = spec.tags.findAll { tag -> usedTags.contains(tag.name) }
    }

    icebergRestCodegenSpec.parentFile.mkdirs()
    icebergRestCodegenSpec.text = icebergRestYaml().dump(codegenSpec)

    def supportPackageDir = new File(icebergRestSupportJavaDir, 'com/linkedin/openhouse/tables/generated/iceberg')
    supportPackageDir.mkdirs()
    def endpointLiterals = advertisedEndpoints.collect { "\"${it}\"" }.join(",\n          ")
    new File(supportPackageDir, 'IcebergRestOpenHouseSupport.java').text = """\
package com.linkedin.openhouse.tables.generated.iceberg;

import java.util.Arrays;
import java.util.Collections;
import java.util.List;

/**
 * Generated from x-openhouse-support annotations in spec/iceberg-rest-catalog-open-api.yaml.
 * Do not edit; change annotations and rebuild.
 */
public final class IcebergRestOpenHouseSupport {
  private IcebergRestOpenHouseSupport() {}

  /** Endpoint strings advertised by GET /v1/config (excludes getConfig itself). */
  public static final List<String> SUPPORTED_ENDPOINTS =
      Collections.unmodifiableList(
          Arrays.asList(
          ${endpointLiterals}));
}
"""
  }
}

tasks.register('icebergRestValidateSpec', JavaExec) {
  dependsOn tasks.named('icebergRestPrepareCodegenSpec')
  classpath = configurations.icebergRestOpenApiGenerator
  mainClass.set("org.openapitools.codegen.OpenAPIGenerator")
  args "validate", "-i", icebergRestCodegenSpec.absolutePath
  inputs.file(icebergRestCodegenSpec)
  inputs.files(configurations.icebergRestOpenApiGenerator)
}

tasks.register('icebergRestCodegen', JavaExec) {
  dependsOn tasks.named('icebergRestValidateSpec')
  doFirst {
    delete generatedIcebergRestDir
  }
  classpath = configurations.icebergRestOpenApiGenerator
  mainClass.set("org.openapitools.codegen.OpenAPIGenerator")
  args "generate",
      "-g", "spring",
      "-i", icebergRestCodegenSpec.absolutePath,
      "-o", generatedIcebergRestDir,
      "--api-package", "com.linkedin.openhouse.tables.generated.iceberg.api",
      "--model-package", "com.linkedin.openhouse.tables.generated.iceberg.model",
      "--import-mappings", icebergImportMappings,
      "--type-mappings", icebergTypeMappings,
      "--global-property",
      "apis,models=CatalogConfig:ListTablesResponse,apiTests=false,apiDocs=false,modelTests=false,modelDocs=false,supportingFiles=",
      "--additional-properties",
      "interfaceOnly=true,useTags=true,skipDefaultInterface=false,hideGenerationTimestamp=true,useSpringBoot3=false,openApiNullable=false"
  inputs.file(icebergRestCodegenSpec)
  inputs.files(configurations.icebergRestOpenApiGenerator)
  outputs.dir(generatedIcebergRestDir)
}

tasks.named('compileJava') {
  dependsOn tasks.named('icebergRestCodegen')
  dependsOn tasks.named('icebergRestPrepareCodegenSpec')
  source "${generatedIcebergRestDir}/src/main/java"
  source icebergRestSupportJavaDir
}

tasks.named('check') {
  dependsOn tasks.named('icebergRestAssertSupportAnnotations')
  dependsOn tasks.named('icebergRestValidateSpec')
}
