plugins {
  id 'openhouse.springboot-ext-conventions'
  id 'openhouse.hadoop-conventions'
  id 'openhouse.iceberg-aws-conventions'
  id 'openhouse.iceberg-azure-conventions'
  id 'openhouse.iceberg-conventions-1.5.2'
  id 'openhouse.maven-publish'
  /**
   * FIXME: Ideally, the below line are also defined in shared buildSrc. But raises following error:
   * Invalid plugin request [id: 'org.springframework.boot', version: '2.1.2.RELEASE'].
   * Plugin requests from precompiled scripts must not include a version number.
   * Please remove the version from the offending request and make sure the module
   * containing the requested plugin 'org.springframework.boot' is an implementation dependency.
   */
  id 'org.springframework.boot' version '2.7.8'

  /**
   * These are the dependencies to enable client generation for the service.
   * */
  id 'com.github.johnrengelman.processes' version '0.5.0'
  id 'org.springdoc.openapi-gradle-plugin' version '1.6.0'
  id 'openhouse.service-specgen-convention'
}

// Configure unique port for OpenAPI spec generation to avoid conflicts during parallel builds
openApi {
  def specPort = project.findProperty('tableOpenApiPort') ?: '8000'
  customBootRun {
    args = ["--server.port=${specPort}"]
  }
  apiDocsUrl.set("http://localhost:${specPort}/v3/api-docs")
}

dependencies {
  implementation "io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations:${otel_annotations_version}"
  api project(':services:common')
  api project(':iceberg:openhouse:internalcatalog')
  api project(':client:hts')
  api project(':cluster:configs')
  api project(':cluster:storage')
  api project(':cluster:metrics')
  api 'org.springframework.security:spring-security-config:5.7.2'
  api 'org.springframework.boot:spring-boot-starter-webflux:2.7.8'
  implementation 'com.cronutils:cron-utils:9.2.0'
  testImplementation project(':client:tableclient')
  testImplementation 'org.openapitools:jackson-databind-nullable:0.2.1'
  testImplementation 'org.junit.jupiter:junit-jupiter-engine:' + junit_version
  testImplementation 'org.springframework.security:spring-security-test:5.7.3'
  testImplementation 'org.springframework:spring-context-support:5.3.18'
  testImplementation(testFixtures(project(':services:common')))
  testImplementation 'org.testcontainers:mysql:1.19.8'
  testRuntimeOnly 'mysql:mysql-connector-java:8.0.33'
  testImplementation (project(':tables-test-fixtures:tables-test-fixtures_2.12')) {
    exclude group: 'com.linkedin.iceberg'
  }
}

def tableE2eBackend = providers.gradleProperty('tableE2eBackend').getOrElse('docker')
if (!(tableE2eBackend in ['docker', 'h2'])) {
  throw new GradleException('tableE2eBackend must be docker or h2')
}

tasks.named('test') {
  inputs.property('tableE2eBackend', tableE2eBackend)
  systemProperty 'tableE2eBackend', tableE2eBackend
  systemProperty 'spring.test.context.cache.maxSize', '1'
  // The existing property initializer also uses java.io.tmpdir for per-context storage.
  def testStorage = layout.buildDirectory.dir('e2e-storage')
  systemProperty 'java.io.tmpdir', testStorage.get().asFile.absolutePath
  doFirst { testStorage.get().asFile.mkdirs() }
  if (tableE2eBackend == 'docker') {
    maxHeapSize = '1536m'
    def htsJar = project(':services:housetables').tasks.named('bootJar')
    dependsOn htsJar
    inputs.files(htsJar.flatMap { it.archiveFile })
    inputs.dir(rootProject.file('services/housetables/ddl'))
    systemProperty 'tableE2eHtsJar', htsJar.flatMap { it.archiveFile }.get().asFile.absolutePath
    systemProperty 'tableE2eDdl', rootProject.file('services/housetables/ddl').absolutePath
  }
}
