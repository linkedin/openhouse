openapi: 3.1.1
info:
  title: OpenHouse Iceberg REST Catalog (read-only profile)
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 0.0.1
  description: OpenHouse Phase 1 read-only subset of the Apache Iceberg 1.11.0 REST Catalog OpenAPI.
paths:
  /v1/config:
    get:
      tags:
      - Configuration API
      summary: List all catalog configuration settings
      operationId: getConfig
      parameters:
      - name: warehouse
        in: query
        required: false
        schema:
          type: string
        description: Warehouse location or identifier to request from the service
      description: ' All REST clients should first call this route to get catalog configuration properties
        from the server to configure the catalog and its HTTP client. Configuration from the server consists
        of two sets of key/value pairs.

        - defaults -  properties that should be used as default configuration; applied before client configuration

        - overrides - properties that should be used to override client configuration; applied after defaults
        and client configuration


        Catalog configuration is constructed by setting the defaults, then client- provided configuration,
        and finally overrides. The final property set is then used to configure the catalog.


        For example, a default configuration property might set the size of the client pool, which can
        be replaced with a client-specific setting. An override might be used to set the warehouse location,
        which is stored on the server rather than in client configuration.


        Common catalog configuration settings are documented at https://iceberg.apache.org/docs/latest/configuration/#catalog-properties


        The catalog configuration also holds an optional `endpoints` field that contains information about
        the endpoints supported by the server. If a server does not send the `endpoints` field, a default
        set of endpoints is assumed:

        - GET /v1/{prefix}/namespaces

        - POST /v1/{prefix}/namespaces

        - GET /v1/{prefix}/namespaces/{namespace}

        - DELETE /v1/{prefix}/namespaces/{namespace}

        - POST /v1/{prefix}/namespaces/{namespace}/properties

        - GET /v1/{prefix}/namespaces/{namespace}/tables

        - POST /v1/{prefix}/namespaces/{namespace}/tables

        - GET /v1/{prefix}/namespaces/{namespace}/tables/{table}

        - POST /v1/{prefix}/namespaces/{namespace}/tables/{table}

        - DELETE /v1/{prefix}/namespaces/{namespace}/tables/{table}

        - POST /v1/{prefix}/namespaces/{namespace}/register

        - POST /v1/{prefix}/namespaces/{namespace}/tables/{table}/metrics

        - POST /v1/{prefix}/tables/rename

        - POST /v1/{prefix}/transactions/commit '
      responses:
        200:
          description: Server specified configuration values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogConfig'
              example:
                overrides:
                  warehouse: s3://bucket/warehouse/
                defaults:
                  clients: '4'
                idempotency-key-lifetime: PT30M
                endpoints:
                - GET /v1/{prefix}/namespaces/{namespace}
                - GET /v1/{prefix}/namespaces
                - POST /v1/{prefix}/namespaces
                - GET /v1/{prefix}/namespaces/{namespace}/tables/{table}
                - GET /v1/{prefix}/namespaces/{namespace}/views/{view}
        400:
          $ref: '#/components/responses/BadRequestErrorResponse'
        401:
          $ref: '#/components/responses/UnauthorizedResponse'
        403:
          $ref: '#/components/responses/ForbiddenResponse'
        404:
          description: Not Found - Warehouse provided in the `warehouse` query parameter is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
              examples:
                NoSuchWarehouseExample:
                  $ref: '#/components/examples/NoSuchWarehouseError'
        419:
          $ref: '#/components/responses/AuthenticationTimeoutResponse'
        503:
          $ref: '#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: '#/components/responses/ServerErrorResponse'
  /v1/{prefix}/namespaces/{namespace}/tables:
    parameters:
    - $ref: '#/components/parameters/prefix'
    - $ref: '#/components/parameters/namespace'
    get:
      tags:
      - Catalog API
      summary: List all table identifiers underneath a given namespace
      description: Return all table identifiers under this namespace
      operationId: listTables
      parameters:
      - $ref: '#/components/parameters/page-token'
      - $ref: '#/components/parameters/page-size'
      responses:
        200:
          $ref: '#/components/responses/ListTablesResponse'
        400:
          $ref: '#/components/responses/BadRequestErrorResponse'
        401:
          $ref: '#/components/responses/UnauthorizedResponse'
        403:
          $ref: '#/components/responses/ForbiddenResponse'
        404:
          description: Not Found - The namespace specified does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
              examples:
                NamespaceNotFound:
                  $ref: '#/components/examples/NoSuchNamespaceError'
        419:
          $ref: '#/components/responses/AuthenticationTimeoutResponse'
        503:
          $ref: '#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: '#/components/responses/ServerErrorResponse'
  /v1/{prefix}/namespaces/{namespace}/tables/{table}:
    parameters:
    - $ref: '#/components/parameters/prefix'
    - $ref: '#/components/parameters/namespace'
    - $ref: '#/components/parameters/table'
    get:
      tags:
      - Catalog API
      summary: Load a table from the catalog
      operationId: loadTable
      description: 'Load a table from the catalog.


        The response contains both configuration and table metadata. The configuration, if non-empty is
        used as additional configuration for the table that overrides catalog configuration. For example,
        this configuration may change the FileIO implementation to be used for the table.


        The response also contains the table''s full metadata, matching the table metadata JSON file.


        The catalog configuration may contain credentials that should be used for subsequent requests
        for the table. The configuration key "token" is used to pass an access token to be used as a bearer
        token for table requests. Otherwise, a token may be passed using a RFC 8693 token type as a configuration
        key. For example, "urn:ietf:params:oauth:token-type:jwt=<JWT-token>".'
      parameters:
      - $ref: '#/components/parameters/data-access'
      - name: If-None-Match
        in: header
        description: An optional header that allows the server to return 304 (Not Modified) if the metadata
          is current. The content is the value of the ETag received in a CreateTableResponse, LoadTableResponse
          or CommitTableResponse.
        required: false
        schema:
          type: string
      - in: query
        name: snapshots
        description: 'The snapshots to return in the body of the metadata via the `snapshots` field. Setting
          the value to `all` would return the full set of snapshots currently valid for the table. Setting
          the value to `refs` would load all snapshots referenced by branches or tags.

          Default if no param is provided is `all`.'
        required: false
        schema:
          type: string
          enum:
          - all
          - refs
      - $ref: '#/components/parameters/referenced-by'
      responses:
        200:
          $ref: '#/components/responses/LoadTableResponse'
        304:
          description: Not Modified - Based on the content of the 'If-None-Match' header the table metadata
            has not changed since.
        400:
          $ref: '#/components/responses/BadRequestErrorResponse'
        401:
          $ref: '#/components/responses/UnauthorizedResponse'
        403:
          $ref: '#/components/responses/ForbiddenResponse'
        404:
          description: Not Found - NoSuchTableException, table to load does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
              examples:
                TableToLoadDoesNotExist:
                  $ref: '#/components/examples/NoSuchTableError'
        419:
          $ref: '#/components/responses/AuthenticationTimeoutResponse'
        503:
          $ref: '#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: '#/components/responses/ServerErrorResponse'
    head:
      tags:
      - Catalog API
      summary: Check if a table exists
      operationId: tableExists
      description: Check if a table exists within a given namespace. The response does not contain a body.
      responses:
        204:
          description: Success, no content
        400:
          $ref: '#/components/responses/BadRequestErrorResponse'
        401:
          $ref: '#/components/responses/UnauthorizedResponse'
        403:
          $ref: '#/components/responses/ForbiddenResponse'
        404:
          description: Not Found - NoSuchTableException, Table not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
              examples:
                TableToLoadDoesNotExist:
                  $ref: '#/components/examples/NoSuchTableError'
        419:
          $ref: '#/components/responses/AuthenticationTimeoutResponse'
        503:
          $ref: '#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: '#/components/responses/ServerErrorResponse'
components:
  examples:
    ListTablesEmptyExample:
      summary: An empty list for a namespace with no tables
      value:
        identifiers: []
    ListTablesNonEmptyExample:
      summary: A non-empty list of table identifiers
      value:
        identifiers:
        - namespace:
          - accounting
          - tax
          name: paid
        - namespace:
          - accounting
          - tax
          name: owed
    NoSuchNamespaceError:
      summary: The requested namespace does not exist
      value:
        error:
          message: The given namespace does not exist
          type: NoSuchNamespaceException
          code: 404
    NoSuchTableError:
      summary: The requested table does not exist
      value:
        error:
          message: The given table does not exist
          type: NoSuchTableException
          code: 404
    NoSuchWarehouseError:
      summary: The requested warehouse does not exist
      value:
        error:
          message: The given warehouse does not exist
          type: NoSuchWarehouseException
          code: 404
  parameters:
    data-access:
      name: X-Iceberg-Access-Delegation
      in: header
      description: 'Optional signal to the server that the client supports delegated access via a comma-separated
        list of access mechanisms.  The server may choose to supply access via any or none of the requested
        mechanisms.


        Specific properties and handling for `vended-credentials` and `remote-signing` are documented
        in the `LoadTableResult` schema section of this spec document.

        '
      required: false
      schema:
        type: string
        enum:
        - vended-credentials
        - remote-signing
      style: simple
      explode: false
      example: vended-credentials,remote-signing
    etag:
      name: ETag
      in: header
      description: 'Identifies a unique version of the table metadata.

        Implementations that support ETags should produce unique tags for responses that return different
        metadata content but represent the same version of table metadata.  For example, the `snapshots`
        query parameter may result in different metadata representations depending on whether `refs` or
        `all` is provided, therefore should have distinct ETags.'
      required: false
      schema:
        type: string
    namespace:
      name: namespace
      in: path
      required: true
      description: A namespace identifier as a single string. Multipart namespace parts must be separated
        by the namespace separator as indicated via the /config override `namespace-separator`, which
        defaults to the unit separator `0x1F` byte (url encoded `%1F`). To be compatible with older clients,
        servers must use both the advertised separator and `0x1F` as valid separators when decoding namespaces.
        The `namespace-separator` should be provided in a url encoded form.
      schema:
        type: string
      examples:
        singlepart_namespace:
          value: accounting
        multipart_namespace:
          value: accounting%1Ftax
    page-size:
      name: pageSize
      in: query
      description: For servers that support pagination, this signals an upper bound of the number of results
        that a client will receive. For servers that do not support pagination, clients may receive results
        larger than the indicated `pageSize`.
      required: false
      schema:
        type: integer
        minimum: 1
    page-token:
      name: pageToken
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PageToken'
    prefix:
      name: prefix
      in: path
      schema:
        type: string
      required: true
      description: An optional prefix in the path
    referenced-by:
      name: referenced-by
      in: query
      description: 'A comma-separated list of fully qualified view names (namespace and view name) representing
        the view reference chain when an entity (table or view) is loaded via a view. The list should
        be ordered with the outermost view first, followed by any intermediate views it references, down
        to the view that directly references the entity. For a simple case where a view directly references
        the entity, the list contains a single view identifier. For nested views (a view referencing another
        view which references the entity), the list contains multiple view identifiers representing the
        complete dependency chain.

        The view identifier is a composite string of the format {namespace}{separator}{viewName}. The
        namespace-separator (defined in /config) acts as the delimiter. When parsing, the last occurrence
        of this separator identifies the boundary between the namespace and the view name. Multipart namespaces
        must follow the encoding rules of the parent parameter in the list namespaces endpoint.

        Multiple view identifiers are separated by commas. Servers should split the parameter value on
        comma characters to parse individual view identifiers. If view names contain commas, they must
        be url-encoded as %2C.

        Example with multiple views (where prod%1Fanalytics is a nested namespace which has a quarterly_view
        which references to monthly_view which then references the entity being loaded) - prod%1Fanalytics%1Fquarterly_view,prod%1Fanalytics%1Fmonthly_view'
      required: false
      schema:
        type: string
    table:
      name: table
      in: path
      description: A table name
      required: true
      schema:
        type: string
      example: sales
  responses:
    AuthenticationTimeoutResponse:
      description: This is an optional status response type that the REST Catalog can issue when the token
        has expired. The client MAY request a new access token and retry the request. 401 UnauthorizedResponse
        SHOULD be preferred over this response type on token expiry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IcebergErrorResponse'
          example:
            error:
              message: Credentials have timed out
              type: AuthenticationTimeoutException
              code: 419
    BadRequestErrorResponse:
      description: Indicates a bad request error. It could be caused by an unexpected request body format
        or other forms of request validation failure, such as invalid json. Usually serves application/json
        content, although in some cases simple text/plain content might be returned by the server's middleware.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IcebergErrorResponse'
          example:
            error:
              message: Malformed request
              type: BadRequestException
              code: 400
    ForbiddenResponse:
      description: Forbidden. Authenticated user does not have the necessary permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IcebergErrorResponse'
          example:
            error:
              message: Not authorized to make this request
              type: NotAuthorizedException
              code: 403
    ListTablesResponse:
      description: A list of table identifiers
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListTablesResponse'
          examples:
            ListTablesResponseNonEmpty:
              $ref: '#/components/examples/ListTablesNonEmptyExample'
            ListTablesResponseEmpty:
              $ref: '#/components/examples/ListTablesEmptyExample'
    LoadTableResponse:
      description: Table metadata result when loading a table
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoadTableResult'
      headers:
        etag:
          $ref: '#/components/parameters/etag'
    ServerErrorResponse:
      description: A server-side problem that might not be addressable from the client side. Used for
        server 5xx errors without more specific documentation in individual routes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IcebergErrorResponse'
          example:
            error:
              message: Internal Server Error
              type: InternalServerError
              code: 500
    ServiceUnavailableResponse:
      description: 'The service is not ready to handle the request, request could have been partially
        processed.

        The service may additionally send a Retry-After header to indicate when to retry, a non idempotent
        request should only be retried by the client when the Retry-After header is present.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IcebergErrorResponse'
          example:
            error:
              message: Slow down
              type: SlowDownException
              code: 503
    UnauthorizedResponse:
      description: Unauthorized. The REST Catalog SHOULD respond with the 401 UnauthorizedResponse when
        the access token provided is expired, revoked, malformed, or invalid for other reasons. The client
        MAY request a new access token and retry the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IcebergErrorResponse'
          example:
            error:
              message: Not authorized to make this request
              type: NotAuthorizedException
              code: 401
  schemas:
    BinaryTypeValue:
      type: string
      description: Binary type values are stored and serialized as an uppercase hexadecimal string
      example: 78797A
    BlobMetadata:
      type: object
      required:
      - type
      - snapshot-id
      - sequence-number
      - fields
      properties:
        type:
          type: string
        snapshot-id:
          type: integer
          format: int64
        sequence-number:
          type: integer
          format: int64
        fields:
          type: array
          items:
            type: integer
        properties:
          type: object
          additionalProperties:
            type: string
    BooleanTypeValue:
      type: boolean
      example: true
    CatalogConfig:
      type: object
      description: Server-provided configuration for the catalog.
      required:
      - defaults
      - overrides
      properties:
        overrides:
          type: object
          additionalProperties:
            type: string
          description: Properties that should be used to override client configuration; applied after
            defaults and client configuration.
        defaults:
          type: object
          additionalProperties:
            type: string
          description: Properties that should be used as default configuration; applied before client
            configuration.
        endpoints:
          type: array
          items:
            type: string
          description: A list of endpoints that the server supports. The format of each endpoint must
            be "<HTTP verb> <resource path from OpenAPI REST spec>". The HTTP verb and the resource path
            must be separated by a space character.
          example:
          - GET /v1/{prefix}/namespaces/{namespace}
          - GET /v1/{prefix}/namespaces
          - POST /v1/{prefix}/namespaces
          - GET /v1/{prefix}/namespaces/{namespace}/tables/{table}
          - GET /v1/{prefix}/namespaces/{namespace}/views/{view}
        idempotency-key-lifetime:
          type: string
          format: duration
          description: Client reuse window for an Idempotency-Key (ISO-8601 duration, e.g., PT30M, PT24H).
            Interpreted as the maximum time from the first submission using a key to the last retry during
            which a client may reuse that key. Servers SHOULD accept retries for at least this duration
            and MAY include a grace period to account for delays/clock skew. Clients SHOULD NOT reuse
            an Idempotency-Key after this window elapses; they SHOULD generate a new key for any subsequent
            attempt. Presence of this field indicates the server supports Idempotency-Key semantics for
            mutation endpoints. If absent, clients MUST assume idempotency is not supported.
          example: PT30M
    DateTypeValue:
      type: string
      format: date
      description: Date type values follow the 'YYYY-MM-DD' ISO-8601 standard date format
      example: '2007-12-03'
    DecimalTypeValue:
      type: string
      description: Decimal type values are serialized as strings. Decimals with a positive scale serialize
        as numeric plain text, while decimals with a negative scale use scientific notation and the exponent
        will be equal to the negated scale. For instance, a decimal with a positive scale is '123.4500',
        with zero scale is '2', and with a negative scale is '2E+20'
      example: '123.4500'
    DoubleTypeValue:
      type: number
      format: double
      example: 123.456
    EncryptedKey:
      type: object
      required:
      - key-id
      - encrypted-key-metadata
      properties:
        key-id:
          type: string
        encrypted-key-metadata:
          type: string
          format: byte
          contentEncoding: base64
        encrypted-by-id:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
    ErrorModel:
      type: object
      description: JSON error payload returned in a response with further details on the error
      required:
      - message
      - type
      - code
      properties:
        message:
          type: string
          description: Human-readable error message
        type:
          type: string
          description: Internal type definition of the error
          example: NoSuchNamespaceException
        code:
          type: integer
          minimum: 400
          maximum: 600
          description: HTTP response code
          example: 404
        stack:
          type: array
          items:
            type: string
    FixedTypeValue:
      type: string
      description: Fixed length type values are stored and serialized as an uppercase hexadecimal string
        preserving the fixed length
      example: 78797A
    FloatTypeValue:
      type: number
      format: float
      example: 3.14
    IcebergErrorResponse:
      description: JSON wrapper for all error responses (non-2xx)
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorModel'
      additionalProperties: false
      example:
        error:
          message: The server does not support this operation
          type: UnsupportedOperationException
          code: 406
    IntegerTypeValue:
      type: integer
      example: 42
    ListTablesResponse:
      type: object
      properties:
        next-page-token:
          $ref: '#/components/schemas/PageToken'
        identifiers:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TableIdentifier'
    ListType:
      type: object
      required:
      - type
      - element-id
      - element
      - element-required
      properties:
        type:
          type: string
          const: list
        element-id:
          type: integer
        element:
          $ref: '#/components/schemas/Type'
        element-required:
          type: boolean
    LoadTableResult:
      description: "Result used when a table is successfully loaded.\n\n\nThe table metadata JSON is returned\
        \ in the `metadata` field. The corresponding file location of table metadata should be returned\
        \ in the `metadata-location` field, unless the metadata is not yet committed. For example, a create\
        \ transaction may return metadata that is staged but not committed.\nClients can check whether\
        \ metadata has changed by comparing metadata locations after the table has been created.\n\n\n\
        The `config` map returns table-specific configuration for the table's resources, including its\
        \ HTTP client and FileIO. For example, config may contain a specific FileIO implementation class\
        \ for the table depending on its underlying storage.\n\n\nThe following configurations should\
        \ be respected by clients:\n\n## General Configurations\n\n- `token`: Authorization bearer token\
        \ to use for table requests if OAuth2 security is enabled\n- `scan-planning-mode`: Communicates\
        \ to clients the supported planning mode. Clients should use this value to fail fast if the supported\
        \ scanning mode is not available on the client. Valid values:\n  - `client`: Clients MUST use\
        \ client-side scan planning\n  - `server`: Clients MUST use server-side scan planning via the\
        \ `planTableScan` endpoint\n\n## AWS Configurations\n\nThe following configurations should be\
        \ respected when working with tables stored in AWS S3\n - `client.region`: region to configure\
        \ client for making requests to AWS\n - `s3.access-key-id`: id for credentials that provide access\
        \ to the data in S3\n - `s3.secret-access-key`: secret for credentials that provide access to\
        \ data in S3\n - `s3.session-token`: if present, this value should be used for as the session\
        \ token\n - `s3.remote-signing-enabled`: if `true` remote signing should be performed as described\
        \ in the `RemoteSignRequest` schema section of this spec document.\n - `s3.cross-region-access-enabled`:\
        \ if `true`, S3 Cross-Region bucket access is enabled\n\n## Storage Credentials\n\nCredentials\
        \ for ADLS / GCS / S3 / ... are provided through the `storage-credentials` field.\nClients must\
        \ first check whether the respective credentials exist in the `storage-credentials` field before\
        \ checking the `config` for credentials.\n\n## Remote Signing\n\nIf remote signing for a specific\
        \ storage provider is enabled, clients must respect the following configurations when creating\
        \ a remote signer client:\n - `signer.endpoint`: the remote signer endpoint. Required. Can either\
        \ be a relative path (to be resolved against `signer.uri`) or an absolute URI.\n - `signer.uri`:\
        \ the base URI to resolve `signer.endpoint` against. Optional. Only meaningful if `signer.endpoint`\
        \ is a relative path. Defaults to the catalog's base URI if not set.\n"
      type: object
      required:
      - metadata
      properties:
        metadata-location:
          type: string
          description: May be null if the table is staged as part of a transaction
          nullable: true
        metadata:
          $ref: '#/components/schemas/TableMetadata'
        config:
          type: object
          additionalProperties:
            type: string
        storage-credentials:
          type: array
          items:
            $ref: '#/components/schemas/StorageCredential'
    LongTypeValue:
      type: integer
      format: int64
      example: 9223372036854775807
    MapType:
      type: object
      required:
      - type
      - key-id
      - key
      - value-id
      - value
      - value-required
      properties:
        type:
          type: string
          const: map
        key-id:
          type: integer
        key:
          $ref: '#/components/schemas/Type'
        value-id:
          type: integer
        value:
          $ref: '#/components/schemas/Type'
        value-required:
          type: boolean
    MetadataLog:
      type: array
      items:
        type: object
        required:
        - metadata-file
        - timestamp-ms
        properties:
          metadata-file:
            type: string
          timestamp-ms:
            type: integer
            format: int64
    Namespace:
      description: Reference to one or more levels of a namespace
      type: array
      items:
        type: string
      example:
      - accounting
      - tax
    NullOrder:
      type: string
      enum:
      - nulls-first
      - nulls-last
    PageToken:
      description: 'An opaque token that allows clients to make use of pagination for list APIs (e.g.
        ListTables). Clients may initiate the first paginated request by sending an empty query parameter
        `pageToken` to the server.

        Servers that support pagination should identify the `pageToken` parameter and return a `next-page-token`
        in the response if there are more results available.  After the initial request, the value of
        `next-page-token` from each response must be used as the `pageToken` parameter value for the next
        request. The server must return `null` value for the `next-page-token` in the last response.

        Servers that support pagination must return all results in a single response with the value of
        `next-page-token` set to `null` if the query parameter `pageToken` is not set in the request.

        Servers that do not support pagination should ignore the `pageToken` parameter and return all
        results in a single response. The `next-page-token` must be omitted from the response.

        Clients must interpret either `null` or missing response value of `next-page-token` as the end
        of the listing results.'
      type: string
      nullable: true
    PartitionField:
      type: object
      required:
      - source-id
      - transform
      - name
      properties:
        field-id:
          type: integer
        source-id:
          type: integer
        name:
          type: string
        transform:
          $ref: '#/components/schemas/Transform'
    PartitionSpec:
      type: object
      required:
      - fields
      properties:
        spec-id:
          type: integer
          readOnly: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/PartitionField'
    PartitionStatisticsFile:
      type: object
      required:
      - snapshot-id
      - statistics-path
      - file-size-in-bytes
      properties:
        snapshot-id:
          type: integer
          format: int64
        statistics-path:
          type: string
        file-size-in-bytes:
          type: integer
          format: int64
    PrimitiveType:
      type: string
      example:
      - long
      - string
      - fixed[16]
      - decimal(10,2)
    PrimitiveTypeValue:
      oneOf:
      - $ref: '#/components/schemas/BooleanTypeValue'
      - $ref: '#/components/schemas/IntegerTypeValue'
      - $ref: '#/components/schemas/LongTypeValue'
      - $ref: '#/components/schemas/FloatTypeValue'
      - $ref: '#/components/schemas/DoubleTypeValue'
      - $ref: '#/components/schemas/DecimalTypeValue'
      - $ref: '#/components/schemas/StringTypeValue'
      - $ref: '#/components/schemas/UUIDTypeValue'
      - $ref: '#/components/schemas/DateTypeValue'
      - $ref: '#/components/schemas/TimeTypeValue'
      - $ref: '#/components/schemas/TimestampTypeValue'
      - $ref: '#/components/schemas/TimestampTzTypeValue'
      - $ref: '#/components/schemas/TimestampNanoTypeValue'
      - $ref: '#/components/schemas/TimestampTzNanoTypeValue'
      - $ref: '#/components/schemas/FixedTypeValue'
      - $ref: '#/components/schemas/BinaryTypeValue'
    Schema:
      allOf:
      - $ref: '#/components/schemas/StructType'
      - type: object
        properties:
          schema-id:
            type: integer
            readOnly: true
          identifier-field-ids:
            type: array
            items:
              type: integer
    Snapshot:
      type: object
      required:
      - snapshot-id
      - timestamp-ms
      - manifest-list
      - summary
      properties:
        snapshot-id:
          type: integer
          format: int64
        parent-snapshot-id:
          type: integer
          format: int64
        sequence-number:
          type: integer
          format: int64
        timestamp-ms:
          type: integer
          format: int64
        manifest-list:
          type: string
          description: Location of the snapshot's manifest list file
        first-row-id:
          type: integer
          format: int64
          description: The first _row_id assigned to the first row in the first data file in the first
            manifest
        added-rows:
          type: integer
          format: int64
          description: The upper bound of the number of rows with assigned row IDs
        summary:
          type: object
          required:
          - operation
          properties:
            operation:
              type: string
              enum:
              - append
              - replace
              - overwrite
              - delete
          additionalProperties:
            type: string
        schema-id:
          type: integer
    SnapshotLog:
      type: array
      items:
        type: object
        required:
        - snapshot-id
        - timestamp-ms
        properties:
          snapshot-id:
            type: integer
            format: int64
          timestamp-ms:
            type: integer
            format: int64
    SnapshotReference:
      type: object
      required:
      - type
      - snapshot-id
      properties:
        type:
          type: string
          enum:
          - tag
          - branch
        snapshot-id:
          type: integer
          format: int64
        max-ref-age-ms:
          type: integer
          format: int64
        max-snapshot-age-ms:
          type: integer
          format: int64
        min-snapshots-to-keep:
          type: integer
    SnapshotReferences:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/SnapshotReference'
    SortDirection:
      type: string
      enum:
      - asc
      - desc
    SortField:
      type: object
      required:
      - source-id
      - transform
      - direction
      - null-order
      properties:
        source-id:
          type: integer
        transform:
          $ref: '#/components/schemas/Transform'
        direction:
          $ref: '#/components/schemas/SortDirection'
        null-order:
          $ref: '#/components/schemas/NullOrder'
    SortOrder:
      type: object
      required:
      - order-id
      - fields
      properties:
        order-id:
          type: integer
          readOnly: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SortField'
    StatisticsFile:
      type: object
      required:
      - snapshot-id
      - statistics-path
      - file-size-in-bytes
      - file-footer-size-in-bytes
      - blob-metadata
      properties:
        snapshot-id:
          type: integer
          format: int64
        statistics-path:
          type: string
        file-size-in-bytes:
          type: integer
          format: int64
        file-footer-size-in-bytes:
          type: integer
          format: int64
        blob-metadata:
          type: array
          items:
            $ref: '#/components/schemas/BlobMetadata'
    StorageCredential:
      type: object
      required:
      - prefix
      - config
      properties:
        prefix:
          type: string
          description: Indicates a storage location prefix where the credential is relevant. Clients should
            choose the most specific prefix (by selecting the longest prefix) if several credentials of
            the same type are available.
        config:
          type: object
          additionalProperties:
            type: string
    StringTypeValue:
      type: string
      example: hello
    StructField:
      type: object
      required:
      - id
      - name
      - type
      - required
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          $ref: '#/components/schemas/Type'
        required:
          type: boolean
        doc:
          type: string
        initial-default:
          $ref: '#/components/schemas/PrimitiveTypeValue'
        write-default:
          $ref: '#/components/schemas/PrimitiveTypeValue'
    StructType:
      type: object
      required:
      - type
      - fields
      properties:
        type:
          type: string
          const: struct
        fields:
          type: array
          items:
            $ref: '#/components/schemas/StructField'
    TableIdentifier:
      type: object
      required:
      - namespace
      - name
      properties:
        namespace:
          $ref: '#/components/schemas/Namespace'
        name:
          type: string
          nullable: false
    TableMetadata:
      type: object
      required:
      - format-version
      - table-uuid
      properties:
        format-version:
          type: integer
          minimum: 1
          maximum: 3
        table-uuid:
          type: string
        location:
          type: string
        last-updated-ms:
          type: integer
          format: int64
        next-row-id:
          type: integer
          format: int64
          description: A long higher than all assigned row IDs; the next snapshot's first-row-id.
        properties:
          type: object
          additionalProperties:
            type: string
        schemas:
          type: array
          items:
            $ref: '#/components/schemas/Schema'
        current-schema-id:
          type: integer
        last-column-id:
          type: integer
        partition-specs:
          type: array
          items:
            $ref: '#/components/schemas/PartitionSpec'
        default-spec-id:
          type: integer
        last-partition-id:
          type: integer
        sort-orders:
          type: array
          items:
            $ref: '#/components/schemas/SortOrder'
        default-sort-order-id:
          type: integer
        encryption-keys:
          type: array
          items:
            $ref: '#/components/schemas/EncryptedKey'
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
        refs:
          $ref: '#/components/schemas/SnapshotReferences'
        current-snapshot-id:
          type: integer
          format: int64
        last-sequence-number:
          type: integer
          format: int64
        snapshot-log:
          $ref: '#/components/schemas/SnapshotLog'
        metadata-log:
          $ref: '#/components/schemas/MetadataLog'
        statistics:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsFile'
        partition-statistics:
          type: array
          items:
            $ref: '#/components/schemas/PartitionStatisticsFile'
    TimeTypeValue:
      type: string
      description: Time type values follow the 'HH:MM:SS.ssssss' ISO-8601 format with microsecond precision
      example: '22:31:08.123456'
    TimestampNanoTypeValue:
      type: string
      description: Timestamp_ns type values follow the 'YYYY-MM-DDTHH:MM:SS.sssssssss' ISO-8601 format
        with nanosecond precision
      example: '2007-12-03T10:15:30.123456789'
    TimestampTypeValue:
      type: string
      description: Timestamp type values follow the 'YYYY-MM-DDTHH:MM:SS.ssssss' ISO-8601 format with
        microsecond precision
      example: '2007-12-03T10:15:30.123456'
    TimestampTzNanoTypeValue:
      type: string
      description: Timestamp_ns type values follow the 'YYYY-MM-DDTHH:MM:SS.sssssssss+00:00' ISO-8601
        format with nanosecond precision, and a timezone offset (+00:00 for UTC)
      example: '2007-12-03T10:15:30.123456789+00:00'
    TimestampTzTypeValue:
      type: string
      description: TimestampTz type values follow the 'YYYY-MM-DDTHH:MM:SS.ssssss+00:00' ISO-8601 format
        with microsecond precision, and a timezone offset (+00:00 for UTC)
      example: '2007-12-03T10:15:30.123456+00:00'
    Transform:
      type: string
      example:
      - identity
      - year
      - month
      - day
      - hour
      - bucket[256]
      - truncate[16]
    Type:
      oneOf:
      - $ref: '#/components/schemas/PrimitiveType'
      - $ref: '#/components/schemas/StructType'
      - $ref: '#/components/schemas/ListType'
      - $ref: '#/components/schemas/MapType'
    UUIDTypeValue:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      maxLength: 36
      minLength: 36
      description: UUID type values are serialized as a 36-character lowercase string in standard UUID
        format as specified by RFC-4122
      example: eb26bdb1-a1d8-4aa6-990e-da940875492c
  securitySchemes:
    OAuth2:
      type: oauth2
      description: 'This scheme is used for OAuth2 authorization.


        For unauthorized requests, services should return an appropriate 401 or 403 response. Implementations
        must not return altered success (200) responses when a request is unauthenticated or unauthorized.

        If a separate authorization server is used, substitute the tokenUrl with the full token path of
        the external authorization server, and use the resulting token to access the resources defined
        in the spec.'
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/tokens
          scopes:
            catalog: Allows interacting with the Config and Catalog APIs
    BearerAuth:
      type: http
      scheme: bearer
servers:
- url: '{scheme}://{host}/{basePath}'
  description: Server URL when the port can be inferred from the scheme
  variables:
    scheme:
      description: The scheme of the URI, either http or https.
      default: https
    host:
      description: The host address for the specified server
      default: localhost
    basePath:
      description: Optional prefix to be appended to all routes
      default: ''
- url: '{scheme}://{host}:{port}/{basePath}'
  description: Generic base server URL, with all parts configurable
  variables:
    scheme:
      description: The scheme of the URI, either http or https.
      default: https
    host:
      description: The host address for the specified server
      default: localhost
    port:
      description: The port used when addressing the host
      default: '443'
    basePath:
      description: Optional prefix to be appended to all routes
      default: ''
security:
- OAuth2:
  - catalog
- BearerAuth: []
