# Upstream SHA-256: 80d2ec83a70eeff6e7194853f8791c17cceb14610fae6a0e6afdd2921806ee4a
#
# This file is checked in and held constant. It is not regenerated by the build.
# To review what OpenHouse omits from upstream, diff this file against the Source URL:
#   curl -fsSL \
#     https://raw.githubusercontent.com/apache/iceberg/apache-iceberg-1.11.0/open-api/rest-catalog-open-api.yaml \
#     -o /tmp/iceberg-rest-upstream.yaml
#   diff -u /tmp/iceberg-rest-upstream.yaml spec/iceberg-rest-catalog-open-api.yaml
#
# Kept operations:
#   GET  /v1/config
#   GET  /v1/{prefix}/namespaces/{namespace}/tables
#   GET  /v1/{prefix}/namespaces/{namespace}/tables/{table}
#   HEAD /v1/{prefix}/namespaces/{namespace}/tables/{table}
